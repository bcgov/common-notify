name: Merge

on:
  push:
    branches: [main, crunchy-demo]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".devcontainer/**"
      - "LICENSE"
      - ".github/graphics/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag set to deploy; e.g. PR number or prod"
        type: string
        default: "prod"

concurrency:
  # Do not interrupt previous workflows
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  builds:
    name: Builds
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, frontend, migrations]
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-builder-ghcr@cb2629351c87dd1c2130073e4ebb7233a9653a63 # v4.4.1
        with:
          package: ${{ matrix.package }}
          tags: dev
          tag_fallback: latest
          triggers: ('${{ matrix.package }}/')

  import:
    name: Import to ImageStream
    needs: [builds]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, frontend, migrations]
    steps:
      - name: Import image to OpenShift ImageStream
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: f6bc3f-tools
          oc_token: ${{ secrets.OC_TOKEN_TOOLS }}
          oc_server: https://api.silver.devops.gov.bc.ca:6443
          commands: |
            # Import dev tag with scheduled re-import to prevent caching issues
            oc tag ghcr.io/${{ github.repository }}/${{ matrix.package }}:dev ${{ matrix.package }}:dev --source=docker --reference-policy=local --scheduled
            # Force immediate re-import to ensure latest image is pulled (non-fatal if it conflicts)
            oc import-image ${{ matrix.package }}:dev --from=ghcr.io/${{ github.repository }}/${{ matrix.package }}:dev --confirm || true
            # Tag as test for TEST environment
            oc tag ${{ matrix.package }}:dev ${{ matrix.package }}:test

  gateway-config-dev:
    name: Apply DEV Gateway Config
    needs: [import]
    runs-on: ubuntu-24.04
    concurrency:
      group: gateway-config-apply
      cancel-in-progress: false # Queue instead of canceling
    steps:
      - uses: actions/checkout@v4
      - name: Generate DEV gateway configuration
        run: |
          chmod +x api-gateway/scripts/generate-gateway-for-stage.sh
          # Generate DEV's routes standalone (tagged ns.gw-fe8c5.dev). TEST/PROD are published
          # independently under their own qualifiers in the jobs below and are not affected.
          api-gateway/scripts/generate-gateway-for-stage.sh dev

      - name: Add open PR routes (path-based routing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find all open PRs to preserve their routes (path-based routing on same tag as DEV)
          OPEN_PRS=$(gh pr list --state open --json number --jq '.[].number')

          if [ -z "$OPEN_PRS" ]; then
            echo "No open PRs found - applying DEV config only"
            exit 0
          fi

          echo "Found open PRs: $OPEN_PRS"
          echo "Generating PR configs to preserve routes alongside DEV..."

          # Start with DEV config
          cp api-gateway/generated/gw-active-services.yaml api-gateway/generated/gw-dev-with-prs.yaml

          # Generate and append each open PR config
          for PR_NUM in $OPEN_PRS; do
            echo "Adding PR-${PR_NUM} routes..."
            chmod +x api-gateway/scripts/generate-gateway-config.sh
            api-gateway/scripts/generate-gateway-config.sh pr common-notify-${PR_NUM}

            # Append PR config to combined file
            echo "---" >> api-gateway/generated/gw-dev-with-prs.yaml
            cat api-gateway/generated/gw-routes-pr.yaml >> api-gateway/generated/gw-dev-with-prs.yaml
          done

          # Use combined file for apply
          mv api-gateway/generated/gw-dev-with-prs.yaml api-gateway/generated/gw-active-services.yaml
          echo "✅ Combined DEV + ${OPEN_PRS} PR route(s)"

      # NOTE: DEV now uses `gwa publish-gateway --qualifier dev` (same pattern as TEST/PROD).
      # The gwservice-to-kong.py converter sets strip_path: false to preserve path-based routing.
      # Using --qualifier dev properly reconciles the dev environment (create/update/delete services),
      # avoiding 409 conflicts when services already exist.
      - name: Publish DEV gateway config (with open PRs)
        env:
          GWA_ACCT: ${{ secrets.GWA_ACCT }}
        run: |
          # Convert kind:GatewayService -> raw Kong config (nested plugins, strip_path:false)
          python3 -c 'import yaml' >/dev/null 2>&1 || pip3 install --quiet --break-system-packages pyyaml
          python3 api-gateway/scripts/gwservice-to-kong.py \
            api-gateway/generated/gw-active-services.yaml > api-gateway/generated/gw-kong-dev.yaml
          curl -L https://github.com/bcgov/gwa-cli/releases/download/v3.0.7/gwa_Linux_x86_64.tgz | tar -xz
          sudo mv gwa /usr/local/bin/
          CLIENT_ID=$(echo "$GWA_ACCT" | jq -r '.client_id')
          CLIENT_SECRET=$(echo "$GWA_ACCT" | jq -r '.client_secret')
          gwa login --client-id "$CLIENT_ID" --client-secret "$CLIENT_SECRET"
          gwa config set gateway gw-fe8c5
          # Publish the dev qualifier as a partial set. --qualifier scopes the reconcile so
          # TEST/PROD (other qualifiers) are left untouched.
          echo "Publishing DEV gateway config (qualifier=dev, including open PRs)…"
          set +e
          OUT=$(gwa publish-gateway api-gateway/generated/gw-kong-dev.yaml --qualifier dev 2>&1)
          STATUS=$?
          set -e
          echo "$OUT"
          # gwa can exit 0 even when the publish is rejected — fail on non-zero exit or rejection markers.
          if [ "$STATUS" -ne 0 ] || echo "$OUT" | grep -qiE "publish failed|Errors encountered|Rejecting request|Validation Errors|Sync Failed"; then
            echo "::error::gwa publish-gateway failed for qualifier=dev"
            exit 1
          fi

  deploy-dev:
    name: Deploy (DEV)
    needs: [gateway-config-dev]
    uses: ./.github/workflows/.deployer.yml
    secrets: inherit
    with:
      environment: DEV
      oc_server: ${{ vars.oc_server }}
      db_user: appproxy # appproxy is the user which works with pgbouncer.
      params: --set frontend.secrets.enabled=true
      db_triggers: ('charts/crunchy/')
      redis_triggers: ('charts/redis/')
      tag: dev

  gateway-config-test:
    name: Apply TEST Gateway Config
    needs: [deploy-dev]
    runs-on: ubuntu-24.04
    environment: TEST  # Requires approval if TEST environment protection is enabled
    concurrency:
      group: gateway-config-apply
      cancel-in-progress: false # Queue instead of canceling
    steps:
      - uses: actions/checkout@v4
      - name: Generate TEST gateway configuration
        run: |
          chmod +x api-gateway/scripts/generate-gateway-config.sh
          # Generate TEST routes only — single qualifier ns.gw-fe8c5.test -> gw-routes-test.yaml
          api-gateway/scripts/generate-gateway-config.sh test
      - name: Publish TEST gateway config
        env:
          GWA_ACCT: ${{ secrets.GWA_ACCT }}
        run: |
          # Convert kind:GatewayService -> raw Kong config (nested plugins, strip_path:false)
          python3 -c 'import yaml' >/dev/null 2>&1 || pip3 install --quiet --break-system-packages pyyaml
          python3 api-gateway/scripts/gwservice-to-kong.py \
            api-gateway/generated/gw-routes-test.yaml > api-gateway/generated/gw-kong-test.yaml
          curl -L https://github.com/bcgov/gwa-cli/releases/download/v3.0.7/gwa_Linux_x86_64.tgz | tar -xz
          sudo mv gwa /usr/local/bin/
          CLIENT_ID=$(echo "$GWA_ACCT" | jq -r '.client_id')
          CLIENT_SECRET=$(echo "$GWA_ACCT" | jq -r '.client_secret')
          gwa login --client-id "$CLIENT_ID" --client-secret "$CLIENT_SECRET"
          gwa config set gateway gw-fe8c5
          # Publish the test qualifier as a partial set. --qualifier scopes the reconcile so
          # DEV/PROD (other qualifiers) are left untouched.
          echo "Publishing TEST gateway config (qualifier=test)…"
          set +e
          OUT=$(gwa publish-gateway api-gateway/generated/gw-kong-test.yaml --qualifier test 2>&1)
          STATUS=$?
          set -e
          echo "$OUT"
          # gwa can exit 0 even when the publish is rejected — fail on non-zero exit or rejection markers.
          if [ "$STATUS" -ne 0 ] || echo "$OUT" | grep -qiE "publish failed|Errors encountered|Rejecting request|Validation Errors|Sync Failed"; then
            echo "::error::gwa publish-gateway failed for qualifier=test"
            exit 1
          fi

  deploy-test:
    name: Deploy (TEST)
    needs: [gateway-config-test]
    uses: ./.github/workflows/.deployer.yml
    secrets: inherit
    with:
      environment: TEST
      oc_server: ${{ vars.oc_server }}
      db_user: appproxy # appproxy is the user which works with pgbouncer.
      params: --set backend.deploymentStrategy=RollingUpdate --set frontend.deploymentStrategy=RollingUpdate --set global.autoscaling=true --set backend.autoscaling.minReplicas=2 --set backend.autoscaling.maxReplicas=2 --set frontend.autoscaling.minReplicas=2 --set frontend.autoscaling.maxReplicas=2 --set frontend.secrets.enabled=true
      db_triggers: ('charts/crunchy/')
      redis_triggers: ('charts/redis/')
      tag: test

  promote-test:
    name: Promote Images to PROD
    needs: [deploy-test]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, frontend, migrations]
    steps:
      - name: Tag images for PROD
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: f6bc3f-tools
          oc_token: ${{ secrets.OC_TOKEN_TOOLS }}
          oc_server: https://api.silver.devops.gov.bc.ca:6443
          commands: |
            # Tag test images as prod for PROD environment
            oc tag ${{ matrix.package }}:test ${{ matrix.package }}:prod

  gateway-config-prod:
    name: Apply PROD Gateway Config
    needs: [promote-test]
    runs-on: ubuntu-24.04
    environment: PROD  # Requires approval if PROD environment protection is enabled
    concurrency:
      group: gateway-config-apply
      cancel-in-progress: false # Queue instead of canceling
    steps:
      - uses: actions/checkout@v4
      - name: Generate PROD gateway configuration
        run: |
          chmod +x api-gateway/scripts/generate-gateway-config.sh
          # Generate PROD routes only — single qualifier ns.gw-fe8c5.prod -> gw-routes-prod.yaml
          api-gateway/scripts/generate-gateway-config.sh prod
      - name: Publish PROD gateway config
        env:
          GWA_ACCT: ${{ secrets.GWA_ACCT }}
        run: |
          # Convert kind:GatewayService -> raw Kong config (nested plugins, strip_path:false)
          python3 -c 'import yaml' >/dev/null 2>&1 || pip3 install --quiet --break-system-packages pyyaml
          python3 api-gateway/scripts/gwservice-to-kong.py \
            api-gateway/generated/gw-routes-prod.yaml > api-gateway/generated/gw-kong-prod.yaml
          curl -L https://github.com/bcgov/gwa-cli/releases/download/v3.0.7/gwa_Linux_x86_64.tgz | tar -xz
          sudo mv gwa /usr/local/bin/
          CLIENT_ID=$(echo "$GWA_ACCT" | jq -r '.client_id')
          CLIENT_SECRET=$(echo "$GWA_ACCT" | jq -r '.client_secret')
          gwa login --client-id "$CLIENT_ID" --client-secret "$CLIENT_SECRET"
          gwa config set gateway gw-fe8c5
          # Publish the prod qualifier as a partial set. --qualifier scopes the reconcile so
          # DEV/TEST (other qualifiers) are left untouched.
          echo "Publishing PROD gateway config (qualifier=prod)…"
          set +e
          OUT=$(gwa publish-gateway api-gateway/generated/gw-kong-prod.yaml --qualifier prod 2>&1)
          STATUS=$?
          set -e
          echo "$OUT"
          # gwa can exit 0 even when the publish is rejected — fail on non-zero exit or rejection markers.
          if [ "$STATUS" -ne 0 ] || echo "$OUT" | grep -qiE "publish failed|Errors encountered|Rejecting request|Validation Errors|Sync Failed"; then
            echo "::error::gwa publish-gateway failed for qualifier=prod"
            exit 1
          fi

  deploy-prod:
    name: Deploy (PROD)
    needs: [gateway-config-prod]
    uses: ./.github/workflows/.deployer.yml
    secrets: inherit
    with:
      environment: PROD
      oc_server: ${{ vars.oc_server }}
      db_user: appproxy # appproxy is the user which works with pgbouncer.
      params: --set backend.deploymentStrategy=RollingUpdate --set frontend.deploymentStrategy=RollingUpdate --set global.autoscaling=true --set backend.autoscaling.minReplicas=5 --set backend.autoscaling.maxReplicas=5 --set frontend.autoscaling.minReplicas=5 --set frontend.autoscaling.maxReplicas=5 --set frontend.pdb.enabled=true --set backend.pdb.enabled=true
      db_triggers: ('charts/crunchy/')
      redis_triggers: ('charts/redis/')
      tag: prod
      timeout-minutes: 15

  create-release:
    name: Create Git Tag and GitHub Release
    needs: [deploy-prod]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for proper version bumping
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get Previous Tag
        id: previous_tag
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREVIOUS_TAG"

      - name: Bump Version
        id: bump_version
        run: |
          chmod +x .github/scripts/bump-version.sh
          .github/scripts/bump-version.sh auto
          NEW_VERSION=$(node -p "require('./frontend/package.json').version")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Check if Tag Exists
        id: check_tag
        run: |
          NEW_VERSION="${{ steps.bump_version.outputs.version }}"
          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️  Tag v$NEW_VERSION already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✓ Tag v$NEW_VERSION does not exist"
          fi

      - name: Create Git Tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          NEW_VERSION="${{ steps.bump_version.outputs.version }}"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          git push origin "v$NEW_VERSION"
          echo "✓ Created and pushed tag v$NEW_VERSION"

      - name: Generate Release Notes
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          chmod +x .github/scripts/generate-release-notes.sh
          .github/scripts/generate-release-notes.sh "${{ steps.previous_tag.outputs.previous_tag }}" "${{ steps.bump_version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump_version.outputs.version }}
          name: Release v${{ steps.bump_version.outputs.version }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          echo "## 🎉 Release Created!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ steps.bump_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Previous Version:** ${{ steps.previous_tag.outputs.previous_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** https://github.com/${{ github.repository }}/releases/tag/v${{ steps.bump_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Production deployment completed and tagged successfully!" >> $GITHUB_STEP_SUMMARY

      - name: Skip Release (Tag Exists)
        if: steps.check_tag.outputs.exists == 'true'
        run: |
          echo "## ⚠️ Release Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tag v${{ steps.bump_version.outputs.version }} already exists." >> $GITHUB_STEP_SUMMARY
          echo "No new release created." >> $GITHUB_STEP_SUMMARY
