name: Merge

on:
  push:
    branches: [main, crunchy-demo]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".devcontainer/**"
      - "LICENSE"
      - ".github/**"
      - ".github/graphics/**"
      - "!.github/workflows/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag set to deploy; e.g. PR number or prod"
        type: string
        default: "prod"

concurrency:
  # Do not interrupt previous workflows
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  builds:
    name: Builds
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, frontend, migrations]
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-builder-ghcr@cb2629351c87dd1c2130073e4ebb7233a9653a63 # v4.4.1
        with:
          package: ${{ matrix.package }}
          tags: dev
          tag_fallback: latest
          triggers: ('${{ matrix.package }}/')

  import:
    name: Import to ImageStream
    needs: [builds]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, frontend, migrations]
    steps:
      - name: Import image to OpenShift ImageStream
        uses: bcgov/action-oc-runner@b1c55b8a8bd5f42b19f72e6ea7df6d6a6eda44a1 # v1.5.1
        with:
          oc_namespace: f6bc3f-tools
          oc_token: ${{ secrets.OC_TOKEN_TOOLS }}
          oc_server: https://api.silver.devops.gov.bc.ca:6443
          commands: |
            # Import dev tag with scheduled re-import to prevent caching issues
            oc tag ghcr.io/${{ github.repository }}/${{ matrix.package }}:dev ${{ matrix.package }}:dev --source=docker --reference-policy=local --scheduled
            # Force immediate re-import to ensure latest image is pulled (non-fatal if it conflicts)
            oc import-image ${{ matrix.package }}:dev --from=ghcr.io/${{ github.repository }}/${{ matrix.package }}:dev --confirm || true
            # Tag as test for TEST environment
            oc tag ${{ matrix.package }}:dev ${{ matrix.package }}:test

  gateway-config-dev:
    name: Apply DEV Gateway Config
    needs: [import]
    runs-on: ubuntu-24.04
    concurrency:
      group: gateway-config-apply
      cancel-in-progress: false # Queue instead of canceling
    steps:
      - uses: actions/checkout@v4
      - name: Generate DEV-only gateway configuration
        run: |
          chmod +x api-gateway/scripts/generate-gateway-for-stage.sh
          # Generate DEV only - this will remove TEST/PROD routes until they are re-approved
          api-gateway/scripts/generate-gateway-for-stage.sh dev
      - name: Apply DEV gateway config (removes TEST/PROD temporarily)
        env:
          GWA_ACCT: ${{ secrets.GWA_ACCT }}
        run: |
          curl -L https://github.com/bcgov/gwa-cli/releases/download/v3.0.7/gwa_Linux_x86_64.tgz | tar -xz
          sudo mv gwa /usr/local/bin/
          CLIENT_ID=$(echo "$GWA_ACCT" | jq -r '.client_id')
          CLIENT_SECRET=$(echo "$GWA_ACCT" | jq -r '.client_secret')
          gwa login --client-id "$CLIENT_ID" --client-secret "$CLIENT_SECRET"
          gwa config set gateway gw-fe8c5
          # Apply DEV only - TEST and PROD routes will be removed until re-approved
          echo "⚠️  Applying DEV config only - TEST and PROD routes will be temporarily removed"
          gwa apply -i api-gateway/generated/gw-active-services.yaml

  deploy-dev:
    name: Deploy (DEV)
    needs: [gateway-config-dev]
    uses: ./.github/workflows/.deployer.yml
    secrets: inherit
    with:
      environment: DEV
      oc_server: ${{ vars.oc_server }}
      db_user: appproxy # appproxy is the user which works with pgbouncer.
      params: --set frontend.secrets.enabled=true
      db_triggers: ('charts/crunchy/')
      redis_triggers: ('charts/redis/')
      tag: dev

  gateway-config-test:
    name: Apply TEST Gateway Config
    needs: [deploy-dev]
    runs-on: ubuntu-24.04
    environment: TEST  # Requires approval if TEST environment protection is enabled
    concurrency:
      group: gateway-config-apply
      cancel-in-progress: false # Queue instead of canceling
    steps:
      - uses: actions/checkout@v4
      - name: Generate DEV+TEST gateway configuration
        run: |
          chmod +x api-gateway/scripts/generate-gateway-for-stage.sh
          # Generate DEV+TEST - this will restore TEST routes (PROD still removed)
          api-gateway/scripts/generate-gateway-for-stage.sh test
      - name: Apply DEV+TEST gateway config (PROD still removed)
        env:
          GWA_ACCT: ${{ secrets.GWA_ACCT }}
        run: |
          curl -L https://github.com/bcgov/gwa-cli/releases/download/v3.0.7/gwa_Linux_x86_64.tgz | tar -xz
          sudo mv gwa /usr/local/bin/
          CLIENT_ID=$(echo "$GWA_ACCT" | jq -r '.client_id')
          CLIENT_SECRET=$(echo "$GWA_ACCT" | jq -r '.client_secret')
          gwa login --client-id "$CLIENT_ID" --client-secret "$CLIENT_SECRET"
          gwa config set gateway gw-fe8c5
          # Apply DEV+TEST - PROD routes remain removed until PROD approval
          echo "✅ Applying DEV+TEST config - TEST routes restored, PROD still removed"
          gwa apply -i api-gateway/generated/gw-active-services.yaml

  deploy-test:
    name: Deploy (TEST)
    needs: [gateway-config-test]
    uses: ./.github/workflows/.deployer.yml
    secrets: inherit
    with:
      environment: TEST
      oc_server: ${{ vars.oc_server }}
      db_user: appproxy # appproxy is the user which works with pgbouncer.
      params: --set frontend.secrets.enabled=true
      db_triggers: ('charts/crunchy/')
      redis_triggers: ('charts/redis/')
      tag: test

  promote-test:
    name: Promote Images to PROD
    needs: [deploy-test]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, frontend, migrations]
    steps:
      - name: Tag images for PROD
        uses: bcgov/action-oc-runner@b1c55b8a8bd5f42b19f72e6ea7df6d6a6eda44a1 # v1.5.1
        with:
          oc_namespace: f6bc3f-tools
          oc_token: ${{ secrets.OC_TOKEN_TOOLS }}
          oc_server: https://api.silver.devops.gov.bc.ca:6443
          commands: |
            # Tag test images as prod for PROD environment
            oc tag ${{ matrix.package }}:test ${{ matrix.package }}:prod

  gateway-config-prod:
    name: Apply PROD Gateway Config
    needs: [promote-test]
    runs-on: ubuntu-24.04
    environment: PROD  # Requires approval if PROD environment protection is enabled
    concurrency:
      group: gateway-config-apply
      cancel-in-progress: false # Queue instead of canceling
    steps:
      - uses: actions/checkout@v4
      - name: Generate DEV+TEST+PROD gateway configuration
        run: |
          chmod +x api-gateway/scripts/generate-gateway-for-stage.sh
          # Generate DEV+TEST+PROD - this will restore all environments
          api-gateway/scripts/generate-gateway-for-stage.sh prod
      - name: Apply DEV+TEST+PROD gateway config (all environments active)
        env:
          GWA_ACCT: ${{ secrets.GWA_ACCT }}
        run: |
          curl -L https://github.com/bcgov/gwa-cli/releases/download/v3.0.7/gwa_Linux_x86_64.tgz | tar -xz
          sudo mv gwa /usr/local/bin/
          CLIENT_ID=$(echo "$GWA_ACCT" | jq -r '.client_id')
          CLIENT_SECRET=$(echo "$GWA_ACCT" | jq -r '.client_secret')
          gwa login --client-id "$CLIENT_ID" --client-secret "$CLIENT_SECRET"
          gwa config set gateway gw-fe8c5
          # Apply all environments - full restoration
          echo "✅ Applying DEV+TEST+PROD config - all environments active"
          gwa apply -i api-gateway/generated/gw-active-services.yaml

  deploy-prod:
    name: Deploy (PROD)
    needs: [gateway-config-prod]
    uses: ./.github/workflows/.deployer.yml
    secrets: inherit
    with:
      environment: PROD
      oc_server: ${{ vars.oc_server }}
      db_user: appproxy # appproxy is the user which works with pgbouncer.
      params: --set backend.deploymentStrategy=RollingUpdate --set frontend.deploymentStrategy=RollingUpdate --set global.autoscaling=true --set frontend.pdb.enabled=true --set backend.pdb.enabled=true
      db_triggers: ('charts/crunchy/')
      redis_triggers: ('charts/redis/')
      tag: prod
      timeout-minutes: 15
