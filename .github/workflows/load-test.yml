name: Load Test

# Ingress load test against the DEV environment.
#   - Manually: Actions → "Load Test" → Run workflow (tune RPS / ramp).
#   - Automatically: called by merge.yml after the DEV deploy completes.
#
# For the run it switches the DEV backend to the non-delivering `log` email sink
# and enables load-test auto-bind, then ALWAYS restores both. Scoped to DEV only.
on:
  workflow_dispatch:
    inputs:
      target_rps:
        description: Peak requests/sec for the ramp
        default: "50"
        type: string
      ramp_seconds:
        description: Seconds per ramp stage (total run ≈ 3× this + 15s)
        default: "60"
        type: string
  workflow_call:
    inputs:
      target_rps:
        default: "50"
        type: string
      ramp_seconds:
        default: "60"
        type: string

permissions: {}

jobs:
  backend-ingress:
    name: Backend ingress (DEV)
    runs-on: ubuntu-24.04
    # Sized for: rollouts (~6m) + ramp (3×ramp_seconds + 15s) + overhead.
    # Raise if you dispatch a long/soak ramp.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # DEV backend deployment (release == <repo>-dev) + shared DEV gateway host.
      # The DEV gateway has no PR path prefix, so requests go straight to /api.
      DEPLOYMENT: ${{ github.event.repository.name }}-dev-backend
      GATEWAY_URL: https://${{ vars.LOAD_TEST_GATEWAY_HOST || 'gw-fe8c5-notify.dev.api.gov.bc.ca' }}/api
    steps:
      - uses: actions/checkout@v6

      # 1. Switch DEV backend to the email sink + enable auto-bind for this run.
      - name: Enable email sink + auto-bind
        uses: bcgov/action-oc-runner@b1c55b8a8bd5f42b19f72e6ea7df6d6a6eda44a1 # v1.5.1
        with:
          oc_namespace: ${{ secrets.oc_namespace || secrets.OC_NAMESPACE || secrets.OC_DEV_NAMESPACE }}
          oc_token: ${{ secrets.oc_token || secrets.OC_TOKEN || secrets.OC_DEV_TOKEN }}
          oc_server: ${{ vars.oc_server }}
          commands: |
            oc set env deployment/${{ env.DEPLOYMENT }} DELIVERY_EMAIL_ADAPTER=log LOADTEST_AUTOBIND_ENABLED=true
            oc rollout status deployment/${{ env.DEPLOYMENT }} --timeout=180s

      # 2. Bind the load-test API key to a throwaway tenant via the gateway.
      #    `|| true` keeps `bash -e` from aborting on a transient curl error so the
      #    loop can retry; cstarTenantId is ignored in auto-bind mode.
      - name: Auto-bind load-test API key
        env:
          API_KEY: ${{ secrets.LOAD_TEST_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/bind.json -w '%{http_code}' -X POST \
              "${{ env.GATEWAY_URL }}/v1/service/api-key/bind" \
              -H "Content-Type: application/json" -H "X-API-KEY: $API_KEY" \
              -d '{"cstarTenantId":"00000000-0000-0000-0000-000000000000"}') || true
            echo "attempt $attempt: bind -> HTTP $code $(cat /tmp/bind.json 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Auto-bind failed after retries"; exit 1

      # 3. Run the ingress ramp through the DEV gateway.
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
      - uses: grafana/run-k6-action@de51a7390bdf0ac85a3bef493691bd71d4c7c158 # v1.4.0
        env:
          BACKEND_URL: ${{ env.GATEWAY_URL }}
          API_KEY: ${{ secrets.LOAD_TEST_API_KEY }}
          TARGET_RPS: ${{ inputs.target_rps }}
          RAMP_SECONDS: ${{ inputs.ramp_seconds }}
        with:
          path: ./tests/load/backend-test.js

      # 3a. Persist raw + human-readable results as an artifact.
      - name: Upload load-test summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-test-summary
          path: |
            summary.json
            summary.md
          retention-days: 14
          if-no-files-found: warn

      # 3b. Render the metrics on the workflow run's summary page.
      - name: Publish summary to run
        if: always()
        run: |
          if [ -f summary.md ]; then
            cat summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary.md produced (k6 may not have started)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # 4. ALWAYS restore DEV to its real email adapter + disable auto-bind,
      #    even if the ramp failed or the run was cancelled.
      - name: Restore email adapter + disable auto-bind
        if: always()
        uses: bcgov/action-oc-runner@b1c55b8a8bd5f42b19f72e6ea7df6d6a6eda44a1 # v1.5.1
        with:
          oc_namespace: ${{ secrets.oc_namespace || secrets.OC_NAMESPACE || secrets.OC_DEV_NAMESPACE }}
          oc_token: ${{ secrets.oc_token || secrets.OC_TOKEN || secrets.OC_DEV_TOKEN }}
          oc_server: ${{ vars.oc_server }}
          commands: |
            oc set env deployment/${{ env.DEPLOYMENT }} DELIVERY_EMAIL_ADAPTER- LOADTEST_AUTOBIND_ENABLED-
            oc rollout status deployment/${{ env.DEPLOYMENT }} --timeout=180s
