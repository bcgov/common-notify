name: .Tests

on:
  workflow_call:
    inputs:
      ### Required
      target:
        description: PR number, test or prod
        default: ${{ github.event.number }}
        type: string
    secrets:
      E2E_TEST_CLIENT_ID:
        required: false
      E2E_TEST_CLIENT_SECRET:
        required: false

env:
  DOMAIN: apps.silver.devops.gov.bc.ca
  PREFIX: ${{ github.event.repository.name }}-${{ inputs.target }}

permissions: {}

jobs:
  integration-tests:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - id: cache-npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-cache-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-cache-node-modules-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - env:
          API_NAME: nest
          BASE_URL: https://${{ env.PREFIX }}.${{ env.DOMAIN }}
          E2E_TEST_CLIENT_ID: ${{ secrets.E2E_TEST_CLIENT_ID }}
          E2E_TEST_CLIENT_SECRET: ${{ secrets.E2E_TEST_CLIENT_SECRET }}
        run: |
          cd tests/integration
          npm ci
          node src/main.js

  e2e-tests:
    name: E2E
    defaults:
      run:
        working-directory: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        project: [chromium, firefox, safari]
    steps:
      - uses: actions/checkout@v6
        name: Checkout
      - uses: actions/setup-node@v6
        name: Setup Node
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run Tests
        env:
          E2E_BASE_URL: https://${{ env.PREFIX }}.${{ env.DOMAIN }}/
          CI: "true"
        run: |
          npx playwright test --project="${{ matrix.project }}" --reporter=html

      - uses: actions/upload-artifact@v7
        if: (! cancelled())
        name: upload results
        with:
          name: playwright-report-${{ matrix.project }}
          path: "./frontend/playwright-report" # path from current folder
          retention-days: 7

  # Frontend load: unauthenticated health/route load against the app route.
  load-tests-frontend:
    name: Load (frontend)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
      - uses: grafana/run-k6-action@de51a7390bdf0ac85a3bef493691bd71d4c7c158 # v1.4.0
        env:
          FRONTEND_URL: https://${{ env.PREFIX }}.${{ env.DOMAIN }}
        with:
          path: ./tests/load/frontend-test.js
          flags: --vus 100 --duration 300s

  # Backend ingress load: authenticated notifysimple ramp through the Kong gateway.
  # The backend is switched to the non-delivering `log` email sink for the duration
  # of the run, then ALWAYS restored to its real adapter (via `oc set env ...-`).
  load-tests-backend:
    name: Load (backend ingress)
    runs-on: ubuntu-24.04
    # Sized for: rollouts (~6m) + ramp (3×RAMP_SECONDS + 15s) + overhead.
    # Raise this if you increase RAMP_SECONDS for longer/soak runs.
    timeout-minutes: 45
    permissions:
      pull-requests: write # post the load-test summary as a PR comment
      contents: read
    env:
      # Backend Deployment name = <helm release>-backend, release == repo-<PR>.
      DEPLOYMENT: ${{ github.event.repository.name }}-${{ inputs.target }}-backend
      # Per-PR Kong gateway. Override the host prefix via repo var LOAD_TEST_GATEWAY_HOST.
      GATEWAY_URL: https://${{ vars.LOAD_TEST_GATEWAY_HOST || 'gw-fe8c5-notify-pr' }}-${{ inputs.target }}.dev.api.gov.bc.ca/api
    steps:
      - uses: actions/checkout@v6

      # 1. Enable the email sink (no external delivery) and load-test auto-bind
      #    (self-bind the API key to a throwaway tenant) for the duration of the run.
      - name: Enable email sink + auto-bind
        uses: bcgov/action-oc-runner@b1c55b8a8bd5f42b19f72e6ea7df6d6a6eda44a1 # v1.5.1
        with:
          oc_namespace: ${{ secrets.oc_namespace || secrets.OC_NAMESPACE || secrets.OC_DEV_NAMESPACE }}
          oc_token: ${{ secrets.oc_token || secrets.OC_TOKEN || secrets.OC_DEV_TOKEN }}
          oc_server: ${{ vars.oc_server }}
          commands: |
            oc set env deployment/${{ env.DEPLOYMENT }} DELIVERY_EMAIL_ADAPTER=log LOADTEST_AUTOBIND_ENABLED=true
            oc rollout status deployment/${{ env.DEPLOYMENT }} --timeout=180s

      # 2. Bind the load-test API key to a tenant via the gateway (auto-bind path).
      #    Body cstarTenantId is ignored in auto-bind mode but must satisfy DTO validation.
      - name: Auto-bind load-test API key
        env:
          API_KEY: ${{ secrets.LOAD_TEST_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/bind.json -w '%{http_code}' -X POST \
              "${{ env.GATEWAY_URL }}/v1/service/api-key/bind" \
              -H "Content-Type: application/json" -H "X-API-KEY: $API_KEY" \
              -d '{"cstarTenantId":"00000000-0000-0000-0000-000000000000"}')
            echo "attempt $attempt: bind -> HTTP $code $(cat /tmp/bind.json)"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Auto-bind failed after retries"; exit 1

      # 3. Run the ingress ramp through the gateway.
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
      - uses: grafana/run-k6-action@de51a7390bdf0ac85a3bef493691bd71d4c7c158 # v1.4.0
        env:
          BACKEND_URL: ${{ env.GATEWAY_URL }}
          API_KEY: ${{ secrets.LOAD_TEST_API_KEY }}
          TARGET_RPS: ${{ vars.LOAD_TEST_TARGET_RPS || '50' }}
        with:
          path: ./tests/load/backend-test.js

      # 3a. Persist the run's results (summary.json + summary.md) as an artifact.
      - name: Upload load-test summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-test-summary
          path: |
            summary.json
            summary.md
          retention-days: 14
          if-no-files-found: warn

      # 3b. Upsert a single sticky PR comment with the key metrics.
      - name: Comment load-test summary on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.target }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -f summary.md ]; then
            echo "No summary.md produced (k6 may not have started); skipping PR comment."
            exit 0
          fi
          marker='<!-- load-test-report -->'
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@summary.md >/dev/null
            echo "Updated existing load-test comment ($id)."
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@summary.md >/dev/null
            echo "Created load-test comment."
          fi

      # 4. ALWAYS restore: remove the sink + auto-bind overrides so the deployment
      #    reverts to its real email adapter, even if the ramp failed or was cancelled.
      - name: Restore email adapter + disable auto-bind
        if: always()
        uses: bcgov/action-oc-runner@b1c55b8a8bd5f42b19f72e6ea7df6d6a6eda44a1 # v1.5.1
        with:
          oc_namespace: ${{ secrets.oc_namespace || secrets.OC_NAMESPACE || secrets.OC_DEV_NAMESPACE }}
          oc_token: ${{ secrets.oc_token || secrets.OC_TOKEN || secrets.OC_DEV_TOKEN }}
          oc_server: ${{ vars.oc_server }}
          commands: |
            oc set env deployment/${{ env.DEPLOYMENT }} DELIVERY_EMAIL_ADAPTER- LOADTEST_AUTOBIND_ENABLED-
            oc rollout status deployment/${{ env.DEPLOYMENT }} --timeout=180s
