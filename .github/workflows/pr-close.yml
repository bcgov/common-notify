name: PR Closed

on:
  pull_request:
    types: [closed]

concurrency:
  # PR open and close use the same group, allowing only one at a time
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  cleanup:
    name: Cleanup and Image Promotion
    uses: bcgov/quickstart-openshift-helpers/.github/workflows/.pr-close.yml@a11ad3d1b9288fb40757c4314a62eb86ff227931 # v1.2.1
    permissions:
      packages: write
    secrets:
      oc_namespace: ${{ secrets.OC_DEV_NAMESPACE }}
      oc_token: ${{ secrets.OC_DEV_TOKEN }}
      oc_server: https://api.silver.devops.gov.bc.ca:6443
    with:
      cleanup: helm
      packages: backend frontend migrations

  cleanup_db: # TODO move it off to another action later.
    name: Remove DB User from Crunchy
    runs-on: ubuntu-slim
    steps:
      - uses: bcgov/action-crunchy@v1.2.6
        name: Remove PR Specific User
        with:
          oc_namespace: ${{ secrets.OC_DEV_NAMESPACE }}
          oc_token: ${{ secrets.OC_DEV_TOKEN }}
          oc_server: https://api.silver.devops.gov.bc.ca:6443
          values_file: charts/crunchy/values.yml

  cleanup_overrides:
    name: Delete PR Override Secret
    runs-on: ubuntu-24.04
    steps:
      # The per-release override secret is created by hand (see the envFrom comment in
      # the backend deployment) so Helm cannot reconcile it away mid-PR. That also means
      # `cleanup: helm` above will not remove it, hence this step.
      - name: Remove <release>-overrides
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ secrets.OC_DEV_NAMESPACE }}
          oc_token: ${{ secrets.OC_DEV_TOKEN }}
          oc_server: https://api.silver.devops.gov.bc.ca:6443
          commands: |
            oc delete secret ${{ github.event.repository.name }}-${{ github.event.number }}-overrides --ignore-not-found

  cleanup_gateway:
    name: Delete PR API Gateway Config
    runs-on: ubuntu-24.04
    env:
      # DEV and PR routes live on the APS test-instance gateway (see
      # api-gateway/config/test-instance/README.md).
      GATEWAY_INSTANCE: test
    concurrency:
      group: gateway-config-apply
      cancel-in-progress: false  # Queue instead of canceling
    steps:
      - uses: actions/checkout@v4

      - name: Generate DEV + remaining open-PR config (exclude closing PR)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --qualifier dev is a full reconcile, so the file must hold everything that stays:
          # DEV and every PR except this one. Publishing the remaining PRs alone would delete
          # DEV's routes as well.
          chmod +x api-gateway/scripts/generate-gateway-config.sh api-gateway/scripts/generate-gateway-for-stage.sh
          CURRENT_PR=${{ github.event.number }}
          OTHER_OPEN_PRS=$(gh pr list --state open --json number --jq '.[] | select(.number != '$CURRENT_PR') | .number')

          api-gateway/scripts/generate-gateway-for-stage.sh dev
          cp api-gateway/generated/gw-active-services.yaml api-gateway/generated/gw-dev-with-prs.yaml

          echo "Remaining open PRs: ${OTHER_OPEN_PRS:-<none>}"
          for PR_NUM in $OTHER_OPEN_PRS; do
            api-gateway/scripts/generate-gateway-config.sh pr common-notify-${PR_NUM}
            echo "---" >> api-gateway/generated/gw-dev-with-prs.yaml
            cat api-gateway/generated/gw-routes-pr.yaml >> api-gateway/generated/gw-dev-with-prs.yaml
          done

          # Convert GatewayService -> Kong format
          python3 -c 'import yaml' >/dev/null 2>&1 || pip3 install --quiet --break-system-packages pyyaml
          python3 api-gateway/scripts/gwservice-to-kong.py \
            api-gateway/generated/gw-dev-with-prs.yaml > api-gateway/generated/gw-kong-dev.yaml

      - name: Remove this PR's routes (publish DEV + remaining PRs to dev qualifier)
        env:
          GWA_ACCT_TEST_INSTANCE: ${{ secrets.GWA_ACCT_TEST_INSTANCE }}
        run: |
          curl -L https://github.com/bcgov/gwa-cli/releases/download/v3.2.0/gwa_Linux_x86_64.tgz | tar -xz
          sudo mv gwa /usr/local/bin/

          echo "Removing PR-${{ github.event.number }} routes from dev qualifier"
          bash api-gateway/scripts/publish-test-instance.sh api-gateway/generated/gw-kong-dev.yaml dev

          echo "✅ Successfully removed PR-${{ github.event.number }} routes"
