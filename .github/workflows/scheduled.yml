name: Scheduled

on:
  schedule: [cron: "0 11 * * 6"] # 3 AM PST = 12 PM UDT, Saturdays
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ageOutPRs:
    name: PR Deployment Purge
    env:
      # https://tecadmin.net/getting-yesterdays-date-in-bash/
      CUTOFF: "1 week ago"
    # ubuntu-slim has no helm; the job reported success while purging nothing.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: read
    steps:
      - name: Clean up Helm Releases
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          # OC_NAMESPACE/OC_TOKEN exist only as DEV environment secrets, and this job
          # declares no environment, so they resolve empty here. Use the repo-level pair
          # that pr-close.yml already uses for the same namespace.
          oc_namespace: ${{ secrets.OC_DEV_NAMESPACE }}
          oc_token: ${{ secrets.OC_DEV_TOKEN }}
          oc_server: ${{ vars.oc_server }}
          commands: |
            # Catch errors, unset variables, and pipe failures (e.g. grep || true )
            set -euo pipefail

            # Echos
            echo "Delete stale Helm releases"
            echo "Cutoff: ${{ env.CUTOFF }}"

            command -v helm >/dev/null || { echo "::error::helm not found on runner"; exit 1; }

            # Before date, list of releases
            BEFORE=$(date +%s -d "${{ env.CUTOFF }}")
            # Anchor on a numeric suffix so only PR releases (common-notify-<PR#>) match.
            # A bare name grep also matches common-notify-dev, which shares this namespace
            # and would be uninstalled after a week with no merges to main.
            RELEASES=$(helm ls -aq | grep -E "^${{ github.event.repository.name }}-[0-9]+$" || :)

            # If releases, then iterate
            [ -z "${RELEASES}" ]|| for r in ${RELEASES[@]}; do

              # Get last update and convert the date
              LAST_DEPLOYED=$(helm status $r -o json 2>/dev/null | jq -r .info.last_deployed || echo "")
              if [ -z "$LAST_DEPLOYED" ]; then
                echo "Warning: Could not get last deployed date for $r, skipping"
                continue
              fi
              UPDATED=$(date "+%s" -d "$LAST_DEPLOYED" || echo "0")

              # Age alone would delete the environment of an open PR that just
              # has not been pushed to in a week.
              PR_NUM=${r##*-}
              PR_STATE=$(GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
                gh pr view "${PR_NUM}" --repo "${{ github.repository }}" \
                --json state -q .state 2>/dev/null || echo "UNKNOWN")
              if [ "${PR_STATE}" = "OPEN" ]; then
                echo -e "\nPR #${PR_NUM} still open: ${r}"
                echo "Skipping"
                continue
              fi
              if [ "${PR_STATE}" = "UNKNOWN" ]; then
                echo -e "\nCould not read PR #${PR_NUM} state: ${r}"
                echo "Skipping to stay safe"
                continue
              fi

              # -lt, not <, which inside [[ ]] compares as strings.
              if [ "${UPDATED}" -lt "${BEFORE}" ]; then
                echo -e "\nOlder than cutoff and PR ${PR_STATE}: ${r}"
                helm uninstall --no-hooks ${r}
                oc delete pvc/${r}-bitnami-pg-0 || true
              else
                echo -e "\nNewer than cutoff: ${r}"
                echo "No need to delete"
              fi
            done

  schema-spy:
    name: SchemaSpy
    permissions:
      contents: write
      pages: write
    uses: bcgov/quickstart-openshift-helpers/.github/workflows/.schema-spy.yml@a11ad3d1b9288fb40757c4314a62eb86ff227931 # v1.2.1
    with:
      flyway_schema: notify
      schemaspy_schema: notify

  # Run sequentially to reduce chances of rate limiting
  zap:
    name: ZAP Scans
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        name: [backend, frontend]
        include:
          - name: backend
            path: api
          - name: frontend
    steps:
      # The action reads rules_file_name out of the workspace, so the repo has
      # to be on disk before it runs.
      - uses: actions/checkout@v7
      - name: ZAP Scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          allow_issue_writing: true
          artifact_name: ${{ matrix.name }}
          issue_title: "ZAP Security Report: ${{ matrix.name }}"
          rules_file_name: .zap/rules.tsv
          token: ${{ secrets.GITHUB_TOKEN }}
          target: https://${{ github.event.repository.name }}-test.apps.silver.devops.gov.bc.ca/${{ matrix.path }}
