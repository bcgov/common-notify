name: CSTAR MCP adapter
on:
  pull_request:
    paths: ["mcp-servers/**", ".github/workflows/cstar-mcp.yml"]
  push:
    branches: [main, crunchy-demo]
    paths: ["mcp-servers/**", ".github/workflows/cstar-mcp.yml"]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-servers/cstar/package-lock.json
      - run: npm ci --ignore-scripts && npm test
        working-directory: mcp-servers/cstar
      - run: docker build -t notify-cstar-mcp:test mcp-servers/cstar
