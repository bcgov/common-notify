name: Emergency Gateway Restore

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "restore" to confirm you want to restore all environments'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  restore-all-environments:
    name: Restore All Gateway Environments
    runs-on: ubuntu-24.04
    if: github.event.inputs.confirm == 'restore'
    steps:
      - uses: actions/checkout@v4

      - name: Generate combined gateway configuration
        run: |
          chmod +x api-gateway/scripts/generate-gateway-for-stage.sh
          api-gateway/scripts/generate-gateway-for-stage.sh prod

      - name: Restore all environments (DEV, TEST, PROD)
        env:
          GWA_ACCT: ${{ secrets.GWA_ACCT }}
        run: |
          # Download and install gwa CLI
          curl -L https://github.com/bcgov/gwa-cli/releases/download/v3.0.7/gwa_Linux_x86_64.tgz | tar -xz
          sudo mv gwa /usr/local/bin/

          # Extract credentials
          CLIENT_ID=$(echo "$GWA_ACCT" | jq -r '.client_id')
          CLIENT_SECRET=$(echo "$GWA_ACCT" | jq -r '.client_secret')

          # Login and configure
          gwa login --client-id "$CLIENT_ID" --client-secret "$CLIENT_SECRET"
          gwa config set gateway gw-fe8c5

          # Apply combined config (restores DEV, TEST, PROD together)
          echo "=========================================="
          echo "Restoring ALL environments:"
          echo "  - DEV"
          echo "  - TEST"
          echo "  - PROD"
          echo "=========================================="
          echo ""

          gwa apply -i api-gateway/generated/gw-active-services.yaml

          echo ""
          echo "=========================================="
          echo "✅ Restoration Complete!"
          echo "=========================================="
          echo ""
          echo "All environments should now be active:"
          echo "  - DEV:  gw-fe8c5-notify.dev.api.gov.bc.ca"
          echo "  - TEST: gw-fe8c5-notify.test.api.gov.bc.ca"
          echo "  - PROD: gw-fe8c5-notify.api.gov.bc.ca"
