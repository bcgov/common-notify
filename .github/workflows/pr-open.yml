name: PR

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".devcontainer/**"
      - "LICENSE"

concurrency:
  # Cancel in progress for PR open and close
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # https://github.com/bcgov/action-builder-ghcr
  builds:
    name: Builds
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, frontend, migrations]
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-builder-ghcr@cb2629351c87dd1c2130073e4ebb7233a9653a63 # v4.4.1
        with:
          package: ${{ matrix.package }}
          tags: ${{ github.event.number }}
          tag_fallback: latest
          triggers: ('${{ matrix.package }}/')

  import:
    name: Import to ImageStream
    needs: [builds]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, frontend, migrations]
    steps:
      - name: Import image to OpenShift ImageStream
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: f6bc3f-tools
          oc_token: ${{ secrets.OC_TOKEN_TOOLS }}
          oc_server: https://api.silver.devops.gov.bc.ca:6443
          commands: |
            oc tag ghcr.io/${{ github.repository }}/${{ matrix.package }}:${{ github.event.number }} ${{ matrix.package }}:${{ github.event.number }} --source=docker --reference-policy=local

  gateway-config:
    name: Apply PR API Gateway Config
    needs: [import]
    runs-on: ubuntu-24.04
    env:
      # DEV and PR routes live on the APS test-instance gateway (see
      # api-gateway/config/test-instance/README.md). PROD stays on gw-fe8c5.
      GATEWAY_INSTANCE: test
    concurrency:
      group: gateway-config-apply
      cancel-in-progress: false # Queue instead of canceling
    steps:
      - uses: actions/checkout@v4

      - name: Generate DEV + all open-PR config (preserve DEV)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # publish-gateway --qualifier dev is a FULL RECONCILE of the dev slice:
          # anything not in the published file is DELETED. Publishing only this PR's
          # service therefore prunes the permanent DEV service and every other PR.
          # So we rebuild the full dev set — DEV + all open PRs — and publish that,
          # exactly like the merge workflow's DEV gateway job. (CCP-5589 / preserves
          # DEV service on PR publish.)
          chmod +x api-gateway/scripts/generate-gateway-config.sh api-gateway/scripts/generate-gateway-for-stage.sh

          # Permanent DEV service
          api-gateway/scripts/generate-gateway-for-stage.sh dev
          cp api-gateway/generated/gw-active-services.yaml api-gateway/generated/gw-dev-with-prs.yaml

          # Fold in every open PR (includes this one)
          OPEN_PRS=$(gh pr list --state open --json number --jq '.[].number')
          echo "Open PRs to include: ${OPEN_PRS:-<none>}"
          for PR_NUM in $OPEN_PRS; do
            api-gateway/scripts/generate-gateway-config.sh pr common-notify-${PR_NUM}
            echo "---" >> api-gateway/generated/gw-dev-with-prs.yaml
            cat api-gateway/generated/gw-routes-pr.yaml >> api-gateway/generated/gw-dev-with-prs.yaml
          done
          mv api-gateway/generated/gw-dev-with-prs.yaml api-gateway/generated/gw-active-services.yaml

      - name: Publish DEV + PR config (path-based routing, preserves DEV)
        env:
          GWA_ACCT_TEST_INSTANCE: ${{ secrets.GWA_ACCT_TEST_INSTANCE }}
        run: |
          # Convert kind:GatewayService -> raw Kong config (nested plugins, strip_path:false,
          # and the /pr-<n> path strip for PR routes).
          python3 -c 'import yaml' >/dev/null 2>&1 || pip3 install --quiet --break-system-packages pyyaml
          python3 api-gateway/scripts/gwservice-to-kong.py \
            api-gateway/generated/gw-active-services.yaml > api-gateway/generated/gw-kong-dev.yaml

          curl -L https://github.com/bcgov/gwa-cli/releases/download/v3.2.0/gwa_Linux_x86_64.tgz | tar -xz
          sudo mv gwa /usr/local/bin/

          # PRs share the dev qualifier and are isolated by path prefix (/pr-111/, /pr-112/).
          echo "✅ Publishing DEV + all open PRs (qualifier=dev, this PR at /pr-${{ github.event.number }}/)"
          bash api-gateway/scripts/publish-test-instance.sh api-gateway/generated/gw-kong-dev.yaml dev

          echo "✅ Gateway config published successfully (DEV preserved)"
          echo "   Routes available at: https://notify-test-dev-api-gov-bc-ca.test.api.gov.bc.ca/pr-${{ github.event.number }}/"

  deploys:
    name: Deploys (${{ github.event.number }})
    needs: [gateway-config]
    uses: ./.github/workflows/.deployer.yml
    secrets: inherit
    with:
      oc_server: ${{ vars.oc_server }}
      tag: ${{ github.event.number }}
      db_user: app-${{ github.event.number }}
      # PR frontends must point at the dev host on the APS test-instance gateway — that
      # is where the path-prefixed PR routes (/pr-<n>/api/*) live, and where keys issued
      # from the Notify UI are valid. The shared notify-frontend-config secret is for the
      # permanent environments, so use secrets.enabled=false and set the frontend config
      # explicitly. Caddy then prepends /pr-<n> (GATEWAY_PATH_PREFIX) to reach this PR's
      # own Kong route.
      params: >-
        --set global.secrets.persist=false
        --set frontend.secrets.enabled=false
        --set frontend.apiGatewayNotifyUrl=https://notify-test-dev-api-gov-bc-ca.test.api.gov.bc.ca
        --set frontend.keycloakUrl=https://test.loginproxy.gov.bc.ca/auth
        --set frontend.keycloakRealm=standard
        --set frontend.keycloakClientId=notify-6388
        --set frontend.cstarApiUrl=https://test.connect.digital.gov.bc.ca
        --set frontend.cstarTenantSetupUrl=https://test.connect.digital.gov.bc.ca
        --set backend.clamav.enabled=false
        --set backend.clamav.host=common-notify-dev-clamav
      triggers: ('backend/' 'frontend/' 'migrations/' 'charts/' 'api-gateway/' '.github/workflows/.deployer.yml')
      db_triggers: ('charts/crunchy/')
      redis_triggers: ('charts/redis/')

  tests:
    name: Tests
    if: needs.deploys.outputs.triggered == 'true'
    needs: [deploys]
    uses: ./.github/workflows/.tests.yml
    secrets:
      E2E_TEST_CLIENT_ID: ${{ secrets.E2E_TEST_CLIENT_ID }}
      E2E_TEST_CLIENT_SECRET: ${{ secrets.E2E_TEST_CLIENT_SECRET }}

  results:
    name: PR Results
    needs: [builds, deploys, tests]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - if: contains(needs.*.result, 'failure')||contains(needs.*.result, 'canceled')
        run: echo "At least one job has failed." && exit 1
      - run: echo "Success!"
