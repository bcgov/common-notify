name: PR

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".devcontainer/**"
      - "LICENSE"

concurrency:
  # Cancel in progress for PR open and close
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # https://github.com/bcgov/action-builder-ghcr
  builds:
    name: Builds
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, frontend, migrations]
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-builder-ghcr@cb2629351c87dd1c2130073e4ebb7233a9653a63 # v4.4.1
        with:
          package: ${{ matrix.package }}
          tags: ${{ github.event.number }}
          tag_fallback: latest
          triggers: ('${{ matrix.package }}/')

  import:
    name: Import to ImageStream
    needs: [builds]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, frontend, migrations]
    steps:
      - name: Import image to OpenShift ImageStream
        uses: bcgov/action-oc-runner@b1c55b8a8bd5f42b19f72e6ea7df6d6a6eda44a1 # v1.5.1
        with:
          oc_namespace: f6bc3f-tools
          oc_token: ${{ secrets.OC_TOKEN_TOOLS }}
          oc_server: https://api.silver.devops.gov.bc.ca:6443
          commands: |
            oc tag ghcr.io/${{ github.repository }}/${{ matrix.package }}:${{ github.event.number }} ${{ matrix.package }}:${{ github.event.number }} --source=docker --reference-policy=local

  gateway-config:
    name: Apply PR API Gateway Config
    needs: [import]
    runs-on: ubuntu-24.04
    concurrency:
      group: gateway-config-apply
      cancel-in-progress: false # Queue instead of canceling
    steps:
      - uses: actions/checkout@v4

      - name: Generate PR config from PR branch
        run: |
          # Generate PR config only from PR branch code
          # PR shares tag ns.gw-fe8c5.dev with DEV (path-based routing)
          # DEV service already exists from merge workflow - only apply PR service
          chmod +x api-gateway/scripts/generate-gateway-config.sh
          api-gateway/scripts/generate-gateway-config.sh pr common-notify-${{ github.event.number }}

      - name: Apply PR config (path-based routing)
        env:
          GWA_ACCT: ${{ secrets.GWA_ACCT }}
        run: |
          # Install gwa CLI
          curl -L https://github.com/bcgov/gwa-cli/releases/download/v3.0.7/gwa_Linux_x86_64.tgz | tar -xz
          sudo mv gwa /usr/local/bin/

          # Login to API Gateway with service account credentials
          CLIENT_ID=$(echo "$GWA_ACCT" | jq -r '.client_id')
          CLIENT_SECRET=$(echo "$GWA_ACCT" | jq -r '.client_secret')
          gwa login --client-id "$CLIENT_ID" --client-secret "$CLIENT_SECRET"

          # Set gateway context
          gwa config set gateway gw-fe8c5

          # Apply PR config only
          # PR shares tag ns.gw-fe8c5.dev with DEV for path-based routing
          # DEV service already exists from merge workflow
          # This adds PR routes without affecting DEV routes (different paths)
          echo "✅ Applying PR config (path-based routing /pr-${{ github.event.number }}/)"

          gwa apply -i api-gateway/generated/gw-routes-pr.yaml 2>&1 | tee /tmp/gwa-output.txt

          # Check results
          if grep -q "Published" /tmp/gwa-output.txt; then
            PUBLISHED_COUNT=$(grep -oP '\d+(?=/\d+ Published)' /tmp/gwa-output.txt || echo "0")
            echo "✅ Published $PUBLISHED_COUNT gateway service(s)"

            if [ "$PUBLISHED_COUNT" -gt 0 ]; then
              echo "✅ PR gateway config published successfully"
              echo "   Routes available at: https://gw-fe8c5-notify.dev.api.gov.bc.ca/pr-${{ github.event.number }}/"
              exit 0
            fi
          fi

          # If we got here, nothing was published
          echo "❌ Gateway config failed to publish"
          cat /tmp/gwa-output.txt
          exit 1

  deploys:
    name: Deploys (${{ github.event.number }})
    needs: [gateway-config]
    uses: ./.github/workflows/.deployer.yml
    secrets: inherit
    with:
      oc_server: ${{ vars.oc_server }}
      tag: ${{ github.event.number }}
      db_user: app-${{ github.event.number }}
      params: --set global.secrets.persist=false --set frontend.secrets.enabled=true --set backend.clamav.enabled=false --set backend.clamav.host=common-notify-dev-clamav
      triggers: ('backend/' 'frontend/' 'migrations/' 'charts/' '.github/workflows/.deployer.yml')
      db_triggers: ('charts/crunchy/')
      redis_triggers: ('charts/redis/')

  tests:
    name: Tests
    if: needs.deploys.outputs.triggered == 'true'
    needs: [deploys]
    uses: ./.github/workflows/.tests.yml
    # inherit so the load job can reach OC creds (OC_DEV_TOKEN/NAMESPACE) for the
    # email-sink toggle and LOAD_TEST_API_KEY for gateway auth, alongside E2E_* secrets.
    secrets: inherit

  results:
    name: PR Results
    needs: [builds, deploys, tests]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - if: contains(needs.*.result, 'failure')||contains(needs.*.result, 'canceled')
        run: echo "At least one job has failed." && exit 1
      - run: echo "Success!"
