name: PR

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".devcontainer/**"
      - "LICENSE"

concurrency:
  # Cancel in progress for PR open and close
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # https://github.com/bcgov/action-builder-ghcr
  builds:
    name: Builds
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, frontend, migrations]
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-builder-ghcr@cb2629351c87dd1c2130073e4ebb7233a9653a63 # v4.4.1
        with:
          package: ${{ matrix.package }}
          tags: ${{ github.event.number }}
          tag_fallback: latest
          triggers: ('${{ matrix.package }}/')

  import:
    name: Import to ImageStream
    needs: [builds]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, frontend, migrations]
    steps:
      - name: Import image to OpenShift ImageStream
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: f6bc3f-tools
          oc_token: ${{ secrets.OC_TOKEN_TOOLS }}
          oc_server: https://api.silver.devops.gov.bc.ca:6443
          commands: |
            oc tag ghcr.io/${{ github.repository }}/${{ matrix.package }}:${{ github.event.number }} ${{ matrix.package }}:${{ github.event.number }} --source=docker --reference-policy=local

  gateway-config:
    name: Apply PR API Gateway Config
    needs: [import]
    runs-on: ubuntu-24.04
    concurrency:
      group: gateway-config-apply
      cancel-in-progress: false # Queue instead of canceling
    steps:
      - uses: actions/checkout@v4

      - name: Generate PR config from PR branch
        run: |
          # Generate PR config only from PR branch code
          # PR shares tag ns.gw-fe8c5.dev with DEV (path-based routing)
          # DEV service already exists from merge workflow - only apply PR service
          chmod +x api-gateway/scripts/generate-gateway-config.sh
          api-gateway/scripts/generate-gateway-config.sh pr common-notify-${{ github.event.number }}

      - name: Publish PR config (path-based routing)
        env:
          GWA_ACCT: ${{ secrets.GWA_ACCT }}
        run: |
          # Convert kind:GatewayService -> raw Kong config (nested plugins, strip_path:false)
          python3 -c 'import yaml' >/dev/null 2>&1 || pip3 install --quiet --break-system-packages pyyaml
          python3 api-gateway/scripts/gwservice-to-kong.py \
            api-gateway/generated/gw-routes-pr.yaml > api-gateway/generated/gw-kong-pr.yaml

          # Install gwa CLI
          curl -L https://github.com/bcgov/gwa-cli/releases/download/v3.0.7/gwa_Linux_x86_64.tgz | tar -xz
          sudo mv gwa /usr/local/bin/

          # Login to API Gateway with service account credentials
          CLIENT_ID=$(echo "$GWA_ACCT" | jq -r '.client_id')
          CLIENT_SECRET=$(echo "$GWA_ACCT" | jq -r '.client_secret')
          gwa login --client-id "$CLIENT_ID" --client-secret "$CLIENT_SECRET"

          # Set gateway context
          gwa config set gateway gw-fe8c5

          # Publish PR config using dev qualifier (all PRs share dev qualifier)
          # PRs are isolated by path prefix (/pr-111/, /pr-112/), not by qualifier
          # This avoids "too many qualified gateways" error and tag conflicts
          echo "✅ Publishing PR config (qualifier=dev, path-based routing /pr-${{ github.event.number }}/)"

          set +e
          OUT=$(gwa publish-gateway api-gateway/generated/gw-kong-pr.yaml --qualifier dev 2>&1)
          STATUS=$?
          set -e

          echo "$OUT"

          # gwa can exit 0 even when the publish is rejected — fail on non-zero exit or rejection markers
          if [ "$STATUS" -ne 0 ] || echo "$OUT" | grep -qiE "publish failed|Errors encountered|Rejecting request|Validation Errors|Sync Failed"; then
            echo "::error::gwa publish-gateway failed for qualifier=dev"
            exit 1
          fi

          echo "✅ PR gateway config published successfully"
          echo "   Routes available at: https://gw-fe8c5-notify.dev.api.gov.bc.ca/pr-${{ github.event.number }}/"

  deploys:
    name: Deploys (${{ github.event.number }})
    needs: [gateway-config]
    uses: ./.github/workflows/.deployer.yml
    secrets: inherit
    with:
      oc_server: ${{ vars.oc_server }}
      tag: ${{ github.event.number }}
      db_user: app-${{ github.event.number }}
      # PR frontends must point at the DEV gateway host — that is where the
      # path-prefixed PR routes (/pr-<n>/api/*) live. The shared
      # notify-frontend-config secret points at TEST, so use secrets.enabled=false
      # and set the frontend config explicitly to dev. Caddy then prepends
      # /pr-<n> (GATEWAY_PATH_PREFIX) to reach this PR's own Kong route.
      params: >-
        --set global.secrets.persist=false
        --set frontend.secrets.enabled=false
        --set frontend.apiGatewayNotifyUrl=https://gw-fe8c5-notify.dev.api.gov.bc.ca
        --set frontend.keycloakUrl=https://dev.loginproxy.gov.bc.ca/auth
        --set frontend.keycloakRealm=standard
        --set frontend.keycloakClientId=notify-6388
        --set backend.clamav.enabled=false
        --set backend.clamav.host=common-notify-dev-clamav
      triggers: ('backend/' 'frontend/' 'migrations/' 'charts/' 'api-gateway/' '.github/workflows/.deployer.yml')
      db_triggers: ('charts/crunchy/')
      redis_triggers: ('charts/redis/')

  tests:
    name: Tests
    if: needs.deploys.outputs.triggered == 'true'
    needs: [deploys]
    uses: ./.github/workflows/.tests.yml
    secrets:
      E2E_TEST_CLIENT_ID: ${{ secrets.E2E_TEST_CLIENT_ID }}
      E2E_TEST_CLIENT_SECRET: ${{ secrets.E2E_TEST_CLIENT_SECRET }}

  results:
    name: PR Results
    needs: [builds, deploys, tests]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - if: contains(needs.*.result, 'failure')||contains(needs.*.result, 'canceled')
        run: echo "At least one job has failed." && exit 1
      - run: echo "Success!"
