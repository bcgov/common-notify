name: PR

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".devcontainer/**"
      - "LICENSE"

concurrency:
  # Cancel in progress for PR open and close
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # https://github.com/bcgov/action-builder-ghcr
  builds:
    name: Builds
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, frontend, migrations]
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-builder-ghcr@cb2629351c87dd1c2130073e4ebb7233a9653a63 # v4.4.1
        with:
          package: ${{ matrix.package }}
          tags: ${{ github.event.number }}
          tag_fallback: latest
          triggers: ('${{ matrix.package }}/')

  import:
    name: Import to ImageStream
    needs: [builds]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, frontend, migrations]
    steps:
      - name: Import image to OpenShift ImageStream
        uses: bcgov/action-oc-runner@b1c55b8a8bd5f42b19f72e6ea7df6d6a6eda44a1 # v1.5.1
        with:
          oc_namespace: f6bc3f-tools
          oc_token: ${{ secrets.OC_TOKEN_TOOLS }}
          oc_server: https://api.silver.devops.gov.bc.ca:6443
          commands: |
            oc tag ghcr.io/${{ github.repository }}/${{ matrix.package }}:${{ github.event.number }} ${{ matrix.package }}:${{ github.event.number }} --source=docker --reference-policy=local

  gateway-config:
    name: Apply PR API Gateway Config
    needs: [import]
    runs-on: ubuntu-24.04
    concurrency:
      group: gateway-config-apply
      cancel-in-progress: false # Queue instead of canceling
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current DEV config from main branch
        run: |
          # Save current PR branch configs
          mkdir -p /tmp/pr-configs
          cp -r api-gateway /tmp/pr-configs/

          # Fetch main branch to get DEV config
          git fetch origin main
          git checkout origin/main -- api-gateway/

          # Generate DEV config only from main branch
          # DEV and PR share the same gateway tag (ns.gw-fe8c5.dev) so they must be published together
          # TEST and PROD have separate tags and remain unchanged
          chmod +x api-gateway/scripts/generate-gateway-config.sh
          api-gateway/scripts/generate-gateway-config.sh dev

          # Save DEV config
          cp api-gateway/generated/gw-routes-dev.yaml /tmp/dev-config.yaml

      - name: Generate PR config from PR branch
        run: |
          # Restore PR branch configs
          rm -rf api-gateway
          cp -r /tmp/pr-configs/api-gateway .

          # Generate PR config only from PR branch code
          chmod +x api-gateway/scripts/generate-gateway-config.sh
          api-gateway/scripts/generate-gateway-config.sh pr common-notify-${{ github.event.number }}

          # Combine: DEV config (main) + PR config (PR branch)
          # Both share the same gateway tag (ns.gw-fe8c5.dev) for path-based routing
          cp /tmp/dev-config.yaml api-gateway/generated/gw-combined-dev-pr.yaml
          echo "---" >> api-gateway/generated/gw-combined-dev-pr.yaml
          cat api-gateway/generated/gw-routes-pr.yaml >> api-gateway/generated/gw-combined-dev-pr.yaml

      - name: Apply DEV+PR config (path-based routing)
        env:
          GWA_ACCT: ${{ secrets.GWA_ACCT }}
        run: |
          # Install gwa CLI
          curl -L https://github.com/bcgov/gwa-cli/releases/download/v3.0.7/gwa_Linux_x86_64.tgz | tar -xz
          sudo mv gwa /usr/local/bin/

          # Login to API Gateway with service account credentials
          CLIENT_ID=$(echo "$GWA_ACCT" | jq -r '.client_id')
          CLIENT_SECRET=$(echo "$GWA_ACCT" | jq -r '.client_secret')
          gwa login --client-id "$CLIENT_ID" --client-secret "$CLIENT_SECRET"

          # Set gateway context
          gwa config set gateway gw-fe8c5

          # Apply: DEV config (from main) + PR config (from PR branch)
          # Both share tag ns.gw-fe8c5.dev for path-based routing
          # TEST and PROD configs remain unchanged (separate tags, already published)
          echo "✅ Applying DEV+PR config (path-based routing on shared tag ns.gw-fe8c5.dev)"
          gwa apply -i api-gateway/generated/gw-combined-dev-pr.yaml

  deploys:
    name: Deploys (${{ github.event.number }})
    needs: [gateway-config]
    uses: ./.github/workflows/.deployer.yml
    secrets: inherit
    with:
      oc_server: ${{ vars.oc_server }}
      tag: ${{ github.event.number }}
      db_user: app-${{ github.event.number }}
      params: --set global.secrets.persist=false --set frontend.secrets.enabled=true --set backend.clamav.enabled=false --set backend.clamav.host=common-notify-dev-clamav
      triggers: ('backend/' 'frontend/' 'migrations/' 'charts/' '.github/workflows/.deployer.yml')
      db_triggers: ('charts/crunchy/')
      redis_triggers: ('charts/redis/')

  tests:
    name: Tests
    if: needs.deploys.outputs.triggered == 'true'
    needs: [deploys]
    uses: ./.github/workflows/.tests.yml
    secrets:
      E2E_TEST_CLIENT_ID: ${{ secrets.E2E_TEST_CLIENT_ID }}
      E2E_TEST_CLIENT_SECRET: ${{ secrets.E2E_TEST_CLIENT_SECRET }}

  results:
    name: PR Results
    needs: [builds, deploys, tests]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - if: contains(needs.*.result, 'failure')||contains(needs.*.result, 'canceled')
        run: echo "At least one job has failed." && exit 1
      - run: echo "Success!"
