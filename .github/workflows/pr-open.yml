name: PR

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".devcontainer/**"
      - "LICENSE"

concurrency:
  # Cancel in progress for PR open and close
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # https://github.com/bcgov/action-builder-ghcr
  builds:
    name: Builds
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, frontend, migrations]
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-builder-ghcr@cb2629351c87dd1c2130073e4ebb7233a9653a63 # v4.4.1
        with:
          package: ${{ matrix.package }}
          tags: ${{ github.event.number }}
          tag_fallback: latest
          triggers: ('${{ matrix.package }}/')

  import:
    name: Import to ImageStream
    needs: [builds]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, frontend, migrations]
    steps:
      - name: Import image to OpenShift ImageStream
        uses: bcgov/action-oc-runner@b1c55b8a8bd5f42b19f72e6ea7df6d6a6eda44a1 # v1.5.1
        with:
          oc_namespace: f6bc3f-tools
          oc_token: ${{ secrets.OC_TOKEN_TOOLS }}
          oc_server: https://api.silver.devops.gov.bc.ca:6443
          commands: |
            oc tag ghcr.io/${{ github.repository }}/${{ matrix.package }}:${{ github.event.number }} ${{ matrix.package }}:${{ github.event.number }} --source=docker --reference-policy=local

  gateway-config:
    name: Apply PR API Gateway Config
    needs: [import]
    runs-on: ubuntu-24.04
    concurrency:
      group: gateway-config-apply
      cancel-in-progress: false # Queue instead of canceling
    steps:
      - uses: actions/checkout@v4

      - name: Generate DEV + all PR configs (preserve DEV)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x api-gateway/scripts/generate-gateway-config.sh
          chmod +x api-gateway/scripts/generate-gateway-for-stage.sh

          # Generate DEV config first (main routes)
          api-gateway/scripts/generate-gateway-for-stage.sh dev

          # Start with DEV as base
          cp api-gateway/generated/gw-active-services.yaml api-gateway/generated/gw-dev-with-prs.yaml

          # Find all open PRs (including this one)
          OPEN_PRS=$(gh pr list --state open --json number --jq '.[].number')

          if [ -z "$OPEN_PRS" ]; then
            echo "No other open PRs found - applying DEV + this PR only"
            # Just this PR
            api-gateway/scripts/generate-gateway-config.sh pr common-notify-${{ github.event.number }}
            echo "---" >> api-gateway/generated/gw-dev-with-prs.yaml
            cat api-gateway/generated/gw-routes-pr.yaml >> api-gateway/generated/gw-dev-with-prs.yaml
          else
            echo "Found open PRs: $OPEN_PRS"
            echo "Generating PR configs to preserve all routes alongside DEV..."

            # Generate and append each open PR config (including this one if already open)
            for PR_NUM in $OPEN_PRS; do
              echo "Adding PR-${PR_NUM} routes..."
              api-gateway/scripts/generate-gateway-config.sh pr common-notify-${PR_NUM}

              # Append PR config to combined file
              echo "---" >> api-gateway/generated/gw-dev-with-prs.yaml
              cat api-gateway/generated/gw-routes-pr.yaml >> api-gateway/generated/gw-dev-with-prs.yaml
            done

            echo "✅ Combined DEV + ${OPEN_PRS} PR route(s)"
          fi

          # Use combined file for apply
          mv api-gateway/generated/gw-dev-with-prs.yaml api-gateway/generated/gw-active-services.yaml

      - name: Apply combined DEV + PR config (preserves DEV)
        env:
          GWA_ACCT: ${{ secrets.GWA_ACCT }}
        run: |
          # Install gwa CLI
          curl -L https://github.com/bcgov/gwa-cli/releases/download/v3.0.7/gwa_Linux_x86_64.tgz | tar -xz
          sudo mv gwa /usr/local/bin/

          # Login to API Gateway with service account credentials
          CLIENT_ID=$(echo "$GWA_ACCT" | jq -r '.client_id')
          CLIENT_SECRET=$(echo "$GWA_ACCT" | jq -r '.client_secret')
          gwa login --client-id "$CLIENT_ID" --client-secret "$CLIENT_SECRET"

          # Set gateway context
          gwa config set gateway gw-fe8c5

          # Apply combined DEV + all PRs config
          # This preserves DEV routes while adding/updating PR routes
          echo "✅ Applying combined DEV + PR config (path-based routing /pr-${{ github.event.number }}/)"

          set +e
          OUT=$(gwa apply -i api-gateway/generated/gw-active-services.yaml 2>&1)
          STATUS=$?
          set -e
          echo "$OUT"

          # gwa can exit 0 even when the publish is rejected — fail on non-zero exit or rejection markers
          if [ "$STATUS" -ne 0 ] || echo "$OUT" | grep -qiE "publish failed|Errors encountered|Rejecting request|Validation Errors"; then
            echo "::error::gwa apply failed for PR gateway config"
            exit 1
          fi

          echo "✅ PR gateway config published successfully"
          echo "   Routes available at: https://gw-fe8c5-notify.dev.api.gov.bc.ca/pr-${{ github.event.number }}/"

  deploys:
    name: Deploys (${{ github.event.number }})
    needs: [gateway-config]
    uses: ./.github/workflows/.deployer.yml
    secrets: inherit
    with:
      oc_server: ${{ vars.oc_server }}
      tag: ${{ github.event.number }}
      db_user: app-${{ github.event.number }}
      params: --set global.secrets.persist=false --set frontend.secrets.enabled=true --set backend.clamav.enabled=false --set backend.clamav.host=common-notify-dev-clamav
      triggers: ('backend/' 'frontend/' 'migrations/' 'charts/' '.github/workflows/.deployer.yml')
      db_triggers: ('charts/crunchy/')
      redis_triggers: ('charts/redis/')

  tests:
    name: Tests
    if: needs.deploys.outputs.triggered == 'true'
    needs: [deploys]
    uses: ./.github/workflows/.tests.yml
    secrets:
      E2E_TEST_CLIENT_ID: ${{ secrets.E2E_TEST_CLIENT_ID }}
      E2E_TEST_CLIENT_SECRET: ${{ secrets.E2E_TEST_CLIENT_SECRET }}

  results:
    name: PR Results
    needs: [builds, deploys, tests]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - if: contains(needs.*.result, 'failure')||contains(needs.*.result, 'canceled')
        run: echo "At least one job has failed." && exit 1
      - run: echo "Success!"
