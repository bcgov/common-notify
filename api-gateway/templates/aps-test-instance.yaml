# Gateway configuration for the APS **test instance** (api-gov-bc-ca.test.api.gov.bc.ca).
#
# This is NOT the "test" environment of the production gateway — that lives in
# routes.yaml alongside dev and prod, on the production APS instance where gw-fe8c5 is
# registered. This file describes a separate, much smaller gateway on APS's own test
# deployment, and exists for one reason: the Credential Issuer API is only deployed
# there, so it is the only place the self-service API key flow can be exercised against
# a real gateway rather than the local mock.
#
# Deliberately minimal. It publishes a single service so the Product Environment has
# something attached — an APS prerequisite for issuing credentials — rather than
# mirroring the full Notify route set. Keeping it small stops it silently drifting out
# of step with routes.yaml and being mistaken for a real deployment target.
#
# Apply with:
#   api-gateway/scripts/generate-gateway-config.sh aps-test-instance
#   gwa apply --input api-gateway/generated/gw-aps-test-instance.yaml \
#     --host api-gov-bc-ca.test.api.gov.bc.ca --gateway notify-test
#
# Note the two different hosts, which are easy to conflate:
#   --host                  the CONTROL plane — which APS instance you administer
#   the hosts: entry below  the DATA plane — where traffic would land
---
kind: DraftDataset
name: ${SERVICE_SUBDOMAIN}-dataset
title: ${PRODUCT_TITLE}
organization: ${ORGANIZATION}
organizationUnit: ${ORGANIZATION_UNIT}
notes: |
  Sandbox gateway for validating BC Notify's self-service API key issuing against the
  APS Credential Issuer API. Not a deployment target and not intended for consumers.
tags: [notify, sandbox]
license_title: Access Only
security_class: PUBLIC
record_publish_date: '2026-01-01'
---
kind: GatewayService
name: ${SERVICE_SUBDOMAIN}-${ENVIRONMENT}
tags: [ns.${GATEWAY_ID}]
host: ${BACKEND_HOST}
port: 80
protocol: http
retries: 0
routes:
  - name: ${SERVICE_SUBDOMAIN}-${ENVIRONMENT}
    tags: [ns.${GATEWAY_ID}]
    hosts:
      - ${SERVICE_SUBDOMAIN}.${ENVIRONMENT}.api.gov.bc.ca
    paths:
      - /api/v1/notifysimple
    methods:
      - POST
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
plugins:
  # Same key-auth shape as every service-to-service route in routes.yaml, so a key
  # issued here is validated the way a real one would be. This is what would make the
  # x-consumer-username question answerable, if the data plane can reach the upstream.
  - name: key-auth
    tags: [ns.${GATEWAY_ID}]
    protocols: [http, https]
    enabled: true
    route: ${SERVICE_SUBDOMAIN}-${ENVIRONMENT}
    config:
      hide_credentials: false
      key_in_body: false
      key_in_header: true
      key_names: ['X-API-KEY']
      run_on_preflight: true
---
kind: Product
name: ${PRODUCT_TITLE}
dataset: ${SERVICE_SUBDOMAIN}-dataset
environments:
  - name: ${ENVIRONMENT}
    # Left inactive on purpose: per the APS docs a Product Environment does not need to
    # be active in the API Directory to issue credentials, and publishing a sandbox to
    # the public directory would be misleading.
    active: false
    approval: false
    # Must be an api-key flow. kong-api-key-only matches what the production Notify
    # environments use; client-credentials returns clientId/clientSecret instead of an
    # apiKey and the backend rejects it with a 400.
    flow: kong-api-key-only
    services: [${SERVICE_SUBDOMAIN}-${ENVIRONMENT}]
