  # ============================================================================
  # /api/v1/service/api-key/bind
  # Binds an API key to a CSTAR tenant.
  # Requires: X-API-KEY header (validated by Kong) AND Authorization: Bearer <jwt>
  # Kong validates the API key and forwards x-credential-identifier to the backend.
  # The backend uses the JWT to verify CSTAR tenant membership before storing the mapping.
  - name: ${ROUTE_PREFIX}api-key-bind
    tags: [ns.${GATEWAY_ID}.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - ${PATH_PREFIX}/api/v1/service/api-key/bind
    methods:
      - POST
    strip_path: true
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true

  # /api/v1/frontend/api-key-usage (frontend variant - usage, history, threshold)
  # Called by the Notify web app with a frontend user JWT (never a service API key).
  # Kong prefix-matches this base path, so it also covers /history (GET) and
  # /threshold (PATCH). The backend enforces exact method+path and CSTAR roles.
  #
  # NOTE: This must be declared BEFORE the /api/v1/frontend/admin/api-key-usage route
  # is NOT a concern here because Kong matches the longest/most-specific prefix, and
  # the admin route lives under a different path segment (/frontend/admin/...).
  - name: ${ROUTE_PREFIX}api-key-usage-frontend
    tags: [ns.${GATEWAY_ID}.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
