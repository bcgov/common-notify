      - ${GATEWAY_HOSTNAME}
    paths:
      - ${PATH_PREFIX}/api/v1/notify/registerCallback
    methods:
      - POST
      - PATCH
      - DELETE
    strip_path: true
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}templates
    tags: [ns.${GATEWAY_ID}.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - ${PATH_PREFIX}/api/v1/templates
    methods:
      - GET
      - POST
