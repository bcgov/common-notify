  # GC Notify clients authenticate with a single credential, sent the same way real
  # GC Notify expects it: `Authorization: ApiKey-v1 {key}`. They aren't expected to
  # also send a separate X-API-KEY header. pre-function extracts the key from that
  # header into X-API-KEY (which key-auth below is configured to validate, same as
  # every other route in this file) before key-auth's access phase runs - pre-function
  # plugins run first by Kong's plugin priority ordering. The original Authorization
  # header is left untouched so passthrough mode can still forward it to real GC
  # Notify. NOT YET VALIDATED against a live Kong instance - confirm this works
  # against the BC Gov-managed gateway (plugin availability/ordering) before merging.
  - name: pre-function
    tags: [ns.${GATEWAY_ID}.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}gcnotify-notifications-list
    config:
      access:
        - |
          local auth = kong.request.get_header("authorization")
          if auth then
            local key = auth:match("^%s*ApiKey%-v1%s+(.+)$")
            if key then
              ngx.req.set_header("X-API-KEY", key)
            end
          end
