    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}notify-event-preview
    config:
      hide_credentials: true
      key_in_body: false
      key_in_header: true
      key_names: ["X-API-KEY"]
      run_on_preflight: true
  - name: key-auth
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}notify-event-types
    config:
      hide_credentials: true
      key_in_body: false
      key_in_header: true
      key_names: ["X-API-KEY"]
      run_on_preflight: true
  - name: key-auth
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}notify-list
    config:
      hide_credentials: true
      key_in_body: false
      key_in_header: true
      key_names: ["X-API-KEY"]
      run_on_preflight: true
  - name: key-auth
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}notify-status
    config:
      hide_credentials: true
      key_in_body: false
      key_in_header: true
      key_names: ["X-API-KEY"]
      run_on_preflight: true
  - name: key-auth
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}notify-callbacks
    config:
      hide_credentials: true
      key_in_body: false
      key_in_header: true
      key_names: ["X-API-KEY"]
      run_on_preflight: true
  - name: key-auth
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}templates
    config:
      hide_credentials: true
      key_in_body: false
      key_in_header: true
      key_names: ["X-API-KEY"]
      run_on_preflight: true
  - name: key-auth
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}gcnotify-notifications-list
    config:
      hide_credentials: true
      key_in_body: false
      key_in_header: true
      key_names: ["X-API-KEY"]
      run_on_preflight: true
  - name: key-auth
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}gcnotify-notifications-email
    config:
      hide_credentials: true
      key_in_body: false
      key_in_header: true
      key_names: ["X-API-KEY"]
      run_on_preflight: true
  - name: key-auth
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}gcnotify-notifications-sms
    config:
      hide_credentials: true
      key_in_body: false
