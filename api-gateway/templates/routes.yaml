      - GET
    strip_path: true
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}feature-flags-frontend
    tags: [ns.${GATEWAY_ID}.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - ${PATH_PREFIX}/api/v1/frontend/feature-flags
    methods:
      - GET
    strip_path: true
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  # GC Notify-compatible routes: sub-paths/shapes mirror the real GC Notify v2 API
  # exactly (https://documentation.notification.canada.ca/en/apispec.html). Kept
  # under a /gcnotify prefix (no /api) so this traffic stays unambiguous in logs,
  # metrics, and Kong dashboards - migrating GC Notify integrations only need to
  # set their baseUrl to {hostname}/gcnotify, a one-line config change, not a code
  # change.
  - name: ${ROUTE_PREFIX}gcnotify-notifications-list
    tags: [ns.${GATEWAY_ID}.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - ${PATH_PREFIX}/gcnotify/v2/notifications
    methods:
      - GET
    strip_path: true
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}gcnotify-notifications-email
    tags: [ns.${GATEWAY_ID}.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - ${PATH_PREFIX}/gcnotify/v2/notifications/email
    methods:
      - POST
    strip_path: true
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}gcnotify-notifications-sms
    tags: [ns.${GATEWAY_ID}.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - ${PATH_PREFIX}/gcnotify/v2/notifications/sms
    methods:
      - POST
    strip_path: true
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}gcnotify-notifications-bulk
    tags: [ns.${GATEWAY_ID}.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - ${PATH_PREFIX}/gcnotify/v2/notifications/bulk
    methods:
      - POST
    strip_path: true
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}gcnotify-notification-by-id
    tags: [ns.${GATEWAY_ID}.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      # Regex, not a literal prefix - matches a single path segment so it doesn't
      # shadow the literal /gcnotify/v2/notifications/email|sms|bulk routes above
      # (Kong matches literal paths before regex paths).
      - ~${PATH_PREFIX}/gcnotify/v2/notifications/[^/]+
    methods:
      - GET
    strip_path: true
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}gcnotify-templates-list
    tags: [ns.${GATEWAY_ID}.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - ${PATH_PREFIX}/gcnotify/v2/templates
    methods:
      - GET
    strip_path: true
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}gcnotify-template-by-id
    tags: [ns.${GATEWAY_ID}.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - ~${PATH_PREFIX}/gcnotify/v2/template/[^/]+
    methods:
      - GET
    strip_path: true
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  # gcnotify-passthrough/v2 routes: same GC Notify-compatible operations as gcnotify/v2
  # but served to clients that have not yet been onboarded to the Notify tenant system.
  # ApiKeyGuard (format-only) validates Authorization header shape in backend and forwards
  # the original header directly to GC Notify. No Kong key-auth on these routes because
  # passthrough uses GC Notify-managed API keys, not Kong-managed credentials.
  - name: ${ROUTE_PREFIX}gcnotify-passthrough-notifications-list
    tags: [ns.${GATEWAY_ID}.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - ${PATH_PREFIX}/gcnotify-passthrough/v2/notifications
    methods:
      - GET
    strip_path: true
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}gcnotify-passthrough-notifications-email
    tags: [ns.${GATEWAY_ID}.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - ${PATH_PREFIX}/gcnotify-passthrough/v2/notifications/email
    methods:
      - POST
    strip_path: true
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}gcnotify-passthrough-notifications-sms
