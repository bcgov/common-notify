      key_names: ["X-API-KEY"]
      run_on_preflight: true
  - name: key-auth
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}gcnotify-notifications-bulk
    config:
      hide_credentials: true
      key_in_body: false
      key_in_header: true
      key_names: ["X-API-KEY"]
      run_on_preflight: true
  - name: key-auth
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}gcnotify-notification-by-id
    config:
      hide_credentials: true
      key_in_body: false
      key_in_header: true
      key_names: ["X-API-KEY"]
      run_on_preflight: true
  - name: key-auth
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}gcnotify-templates-list
    config:
      hide_credentials: true
      key_in_body: false
      key_in_header: true
      key_names: ["X-API-KEY"]
      run_on_preflight: true
  - name: key-auth
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}gcnotify-template-by-id
    config:
      hide_credentials: true
      key_in_body: false
      key_in_header: true
      key_names: ["X-API-KEY"]
      run_on_preflight: true

  # ============================================================================
  # SERVICE & FRONTEND PLUGINS
  # Each route appears twice: once for service tokens, once for frontend tokens
  # ============================================================================

  # Code Tables - Service Token
  - name: key-auth
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}code-tables-service
