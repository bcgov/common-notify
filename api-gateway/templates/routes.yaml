    strip_path: true
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}gcnotify-passthrough-templates-list
    tags: [ns.${GATEWAY_ID}.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - ${PATH_PREFIX}/gcnotify-passthrough/v2/templates
    methods:
      - GET
    strip_path: true
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}gcnotify-passthrough-template-by-id
    tags: [ns.${GATEWAY_ID}.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - ~${PATH_PREFIX}/gcnotify-passthrough/v2/template/[^/]+
    methods:
      - GET
    strip_path: true
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true

  # ============================================================================
  # SERVICE & FRONTEND ROUTES
  # Routes that support BOTH service tokens AND frontend user tokens
