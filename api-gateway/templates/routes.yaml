kind: GatewayService
name: ${GATEWAY_SERVICE_NAME}
tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
host: ${BACKEND_HOST}
port: 80
protocol: http
retries: 0
routes:
  - name: ${ROUTE_PREFIX}ches-email
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /ches/api/v1/email
    methods:
      - POST
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}notify-simple
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/v1/notifysimple
    methods:
      - POST
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}notify-simple-cancel-reschedule
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - ~/api/v1/notifysimple/[^/]+
    methods:
      - PATCH
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}notify-event
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/v1/notifyevent
    methods:
      - POST
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}notify-event-preview
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/v1/notifyevent/preview
    methods:
      - POST
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}notify-event-types
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/v1/notifyevent/types
    methods:
      - GET
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}notify-list
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/v1/notify
    methods:
      - GET
      - DELETE
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}notify-status
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/v1/notify/status
    methods:
      - GET
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}notify-callbacks
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/v1/notify/registerCallback
    methods:
      - POST
      - PATCH
      - DELETE
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}templates
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/v1/templates
    methods:
      - GET
      - POST
      - PATCH
      - DELETE
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}feature-flags
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/v1/feature-flags
    methods:
      - GET
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}gcnotify-notifications-list
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/gcnotify/v2/notifications
    methods:
      - GET
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}gcnotify-notifications-email
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/gcnotify/v2/notifications/email
    methods:
      - POST
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}gcnotify-notifications-sms
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/gcnotify/v2/notifications/sms
    methods:
      - POST
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}gcnotify-notifications-bulk
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/gcnotify/v2/notifications/bulk
    methods:
      - POST
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}gcnotify-notification-by-id
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/gcnotify/v2/notifications/*
    methods:
      - GET
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}gcnotify-templates-list
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/gcnotify/v2/templates
    methods:
      - GET
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}gcnotify-template-by-id
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/gcnotify/v2/template/*
    methods:
      - GET
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true

  # ============================================================================
  # SERVICE & FRONTEND ROUTES
  # Routes that support BOTH service tokens AND frontend user tokens
  # Note: Each route appears twice (-service and -frontend variants)
  #       to handle different issuer/audience combinations
  # ============================================================================

  # /api/v1/code-tables (service variant)
  - name: ${ROUTE_PREFIX}code-tables-service
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/v1/code-tables
    methods:
      - GET
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  # /api/v1/code-tables (frontend variant)
  - name: ${ROUTE_PREFIX}code-tables-status-service
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/v1/code-tables/notification-status
    methods:
      - GET
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  # /api/v1/code-tables/notification-status (frontend variant)
  - name: ${ROUTE_PREFIX}code-tables-channels-service
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/v1/code-tables/channels
    methods:
      - GET
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  # /api/v1/code-tables/channels (frontend variant)
  - name: ${ROUTE_PREFIX}code-tables-event-types-service
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/v1/code-tables/event-types
    methods:
      - GET
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  # /api/v1/code-tables/event-types (frontend variant)
  - name: ${ROUTE_PREFIX}code-tables-feature-flags-service
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/v1/code-tables/feature-flags
    methods:
      - GET
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true

  # /api/v1/code-tables/feature-flags (frontend variant)
  - name: ${ROUTE_PREFIX}notification-request-service
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/v1/notification_request
    methods:
      - GET
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  # /api/v1/notification_request (frontend variant)

plugins:
  # ============================================================================
  # SERVICE-TO-SERVICE PLUGINS
  # ============================================================================
  - name: key-auth
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}ches-email
    config:
      hide_credentials: true
      key_in_body: false
      key_in_header: true
      key_names: ["X-API-KEY"]
      run_on_preflight: true
  - name: key-auth
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}notify-simple
    config:
      hide_credentials: true
      key_in_body: false
      key_in_header: true
      key_names: ["X-API-KEY"]
      run_on_preflight: true
  - name: key-auth
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}notify-simple-cancel-reschedule
    config:
      hide_credentials: true
      key_in_body: false
      key_in_header: true
      key_names: ["X-API-KEY"]
      run_on_preflight: true
  - name: key-auth
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}notify-event
    config:
