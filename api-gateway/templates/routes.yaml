kind: GatewayService
name: ${GATEWAY_SERVICE_NAME}
tags: [ns.${GATEWAY_ID}.${ENVIRONMENT}]
host: ${BACKEND_HOST}
port: 80
protocol: http
retries: 0
routes:
  # ============================================================================
  # PUBLIC ROUTES - No authentication required
  # ============================================================================
  - name: ${ROUTE_PREFIX}notify-health
    tags: [ns.${GATEWAY_ID}.${ENVIRONMENT}]
    protocols:
      - https
      - http
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /health
    methods:
      - GET
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
  - name: ${ROUTE_PREFIX}notify-api-health
    tags: [ns.${GATEWAY_ID}.${ENVIRONMENT}]
    protocols:
      - https
      - http
    hosts:
      - ${GATEWAY_HOSTNAME}
    paths:
      - /api/health
    methods:
      - GET
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true

