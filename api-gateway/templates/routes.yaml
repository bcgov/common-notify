      hide_credentials: true
      key_in_body: false
      key_in_header: true
      key_names: ["X-API-KEY"]
      run_on_preflight: true

  # Code Tables Event Types - Frontend Token
  - name: key-auth
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}notification-request-service
    config:
      hide_credentials: true
      key_in_body: false
      key_in_header: true
      key_names: ["X-API-KEY"]
      run_on_preflight: true

  # Notification Request - Frontend Token
  - name: key-auth
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}feature-flags
    config:
      hide_credentials: true
      key_in_body: false
      key_in_header: true
      key_names: ["X-API-KEY"]
      run_on_preflight: true

  # Feature Flags Frontend - Frontend Token (authenticated users)
  - name: key-auth
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}code-tables-feature-flags-service
    config:
      hide_credentials: true
      key_in_body: false
      key_in_header: true
      key_names: ["X-API-KEY"]
      run_on_preflight: true

  # Code Tables Feature Flags - Frontend Token
