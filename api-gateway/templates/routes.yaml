      hide_credentials: true
      key_in_body: false
      key_in_header: true
      key_names: ["X-API-KEY"]
      run_on_preflight: true

  # Code Tables Channels - Frontend Token
  - name: key-auth
    tags: [ns.${GATEWAY_ID}, env.${ENVIRONMENT}]
    protocols: [http, https]
    enabled: true
    route: ${ROUTE_PREFIX}code-tables-event-types-service
