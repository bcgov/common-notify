# Dev environment overrides for Redis
# - Reduced replicas due to storage constraints (40Gi quota)
# - No PodDisruptionBudget: dev nodes are drained routinely and a blocked drain
#   there costs more than the restart. The keys below were `podDisruptionBudget.
#   enabled`, which upstream renamed to `pdb.create`, so dev had PDBs regardless.
# - Disabled Sentinel (not needed with only 1 replica)
replica:
  replicaCount: 1
  pdb:
    create: false
sentinel:
  enabled: false
master:
  pdb:
    create: false
