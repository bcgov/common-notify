# Production environment overrides
#
# storageClass is empty so the field is omitted: PROD's volumeClaimTemplates
# have no storageClassName, and that field is immutable, so setting it - even
# to the class its PVCs already use - fails the upgrade.
global:
  storageClass: ""
master:
  persistence:
    size: 8Gi
    storageClass: ""
replica:
  replicaCount: 2
  persistence:
    size: 8Gi
    storageClass: ""
