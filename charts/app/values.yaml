# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
#-- global variables, can be accessed by sub-charts.
global:
  #-- the registry where the images are stored. override during runtime for other registry at global level or individual level.
  repository: ~ # provide the repo name from where images will be sourced for example bcgo
  #-- the registry where the images are stored. override during runtime for other registry at global level or individual level. default is ghcr.io
  registry: ghcr.io # ghcr.io for directly streaming from github container registry or "artifacts.developer.gov.bc.ca/github-docker-remote" for artifactory, or any other registry. Templates use default "ghcr.io" as fallback if overridden to null.
  #-- the tag of the image, it can be latest, 1.0.0 etc..., or the sha256 hash
  tag: ~
  #-- master switch for autoscaling across the suite. No HPA is created unless
  #-- BOTH this and the component's own autoscaling.enabled are true, and the
  #-- deployments omit their `replicas` field under exactly that same condition.
  #-- Kept FALSE by default on purpose: these defaults are the DEV/PR profile,
  #-- and f6bc3f-dev hosts every open PR environment in one namespace against a
  #-- 3-core quota — HPAs with minReplicas 3 per PR would exhaust it immediately.
  #-- TEST and PROD turn it on via values-test.yaml / values-prod.yaml.
  autoscaling: false
  #-- global secrets, can be accessed by sub-charts.
  secrets:
    enabled: true
    databasePassword: ~
    databaseName: ~
    persist: true
  config:
    databaseUser: ~
    redisHost: ~ # Redis host, should be set to common-notify-redis-master. Defaults to <release-name>-redis-master if not set
    redisSecret: ~ # Redis secret name, should be set to common-notify-redis. Defaults to <release-name>-redis if not set
  #-- domain of the application, it is required, apps.silver.devops.gov.bc.ca for silver cluster and apps.devops.gov.bc.ca for gold cluster
  domain: 'apps.silver.devops.gov.bc.ca' # it is apps.gold.devops.gov.bc.ca for gold cluster
  databaseAlias: ~ # set using github action workflow during helm deploy.

#-- the components of the application, backend.
backend:
  #-- enable or disable backend
  enabled: true
  #-- the deployment strategy, can be "Recreate" or "RollingUpdate".
  #-- Recreate is the DEV/PR default: those run a single replica in a quota-tight
  #-- shared namespace, where RollingUpdate's surge pod is more expensive than the
  #-- brief restart is painful. TEST and PROD use RollingUpdate (see values-*.yaml).
  deploymentStrategy: Recreate
  #-- the number of replicas. Only applied when autoscaling is off for this
  #-- component (global.autoscaling AND backend.autoscaling.enabled); when
  #-- autoscaling is on, the HPA owns the replica count instead.
  replicaCount: 1
  #-- autoscaling for the component. it is optional and is an object.
  #-- NOTE: enabled:true alone does nothing — global.autoscaling gates it too.
  autoscaling:
    #-- enable or disable autoscaling.
    enabled: true
    #-- the minimum number of replicas.
    minReplicas: 3
    #-- the maximum number of replicas.
    maxReplicas: 7
    #-- the target cpu utilization percentage, is from request cpu and NOT LIMIT CPU.
    targetCPUUtilizationPercentage: 80
  #-- vault, for injecting secrets from vault. it is optional and is an object. it creates an initContainer which reads from vault and app container can source those secrets. for referring to a working example with vault follow this link: https://github.com/bcgov/onroutebc/blob/main/charts/onroutebc/values.yaml#L171-L186
  vault:
    #-- enable or disable vault.
    enabled: false
    #-- the role of the vault. it is required, #licenseplate-prod or licenseplate-nonprod, license plate is the namespace without env
    role: ~
    #-- the vault path where the secrets live. it is required, dev/api-1, dev/api-2, test/api-1 etc...
    secretPaths:
      - dev/api-1
      - dev/api-2
      - test/api-1
      - test/api-2
      - prod/api-1
      - prod/api-2
    #-- resources specific to vault initContainer. it is optional and is an object.
    resources:
      requests:
        cpu: 50m
        memory: 25Mi
      limits:
        cpu: 4
        memory: 8Gi
  #-- the service for the component. for inter namespace communication, use the service name as the hostname.
  service:
    #-- the type of the service. it can be ClusterIP, NodePort, LoadBalancer, ExternalName. ClusterIP is the default and is recommended.
    type: ClusterIP
    port: 80 # this is the service port, where it will be exposed internal to the namespace.
    targetPort: 3000 # this is container port where app listens on
  pdb:
    # Off for DEV/PR. A PDB is only safe once there is more than one replica:
    # with replicaCount 1, minAvailable 1 permits zero voluntary disruptions and
    # blocks node drains indefinitely. Enabled in values-test.yaml and
    # values-prod.yaml, where minReplicas is 2 and 5 respectively.
    enabled: false
    # Must stay strictly BELOW the replica count, or drains never complete.
    minAvailable: 1
  networkPolicy:
    enabled: true # enable NetworkPolicy to restrict traffic to backend
    # Allows traffic from:
    # 1. OpenShift Router (ingress policy-group)
    # 2. Frontend pods in same release
    # 3. Monitoring namespace (monitoring policy-group)
    # 4. Any namespace on port 3000 (for Kong API Gateway)
    # NOTE: More restrictive namespace selector needed from platform team
  #-- ClamAV antivirus scanning configuration
  clamav:
    #-- enable or disable ClamAV deployment
    #-- Default: true for DEV/TEST/PROD environments (one per namespace)
    #-- Disabled for PR environments (set in pr-open.yml) - PRs share the namespace's ClamAV instance
    #-- Similar to shared PVC approach: one ClamAV per namespace, shared by all PRs
    #-- Each ClamAV instance uses: 200m CPU + 768Mi memory (limits: 2 CPU + 2Gi memory)
    enabled: true
    #-- hostname of the ClamAV service (clamd daemon)
    #-- Leave null to use chart default: <release-name>-clamav
    #-- PRs override this to 'common-notify-dev-clamav' to use shared instance
    host: ~
    #-- port of the ClamAV service
    port: 3310
    #-- connection timeout in milliseconds
    timeout: 30000
    #-- fail closed when ClamAV is disabled or unavailable
    failClosed: false
  #-- File attachments storage configuration
  attachments:
    #-- directory where attachments will be stored
    storageDir: /app/attachments
    #-- PersistentVolumeClaim configuration for attachment storage
    pvc:
      #-- enable or disable PVC for attachment storage
      enabled: true
      #-- use shared PVC across all PRs (recommended to save storage)
      shared: true
      #-- force creation of shared PVC (only needed once per namespace)
      createShared: false
      #-- size of the PVC (storage capacity) - only used when creating new PVC
      size: 3Gi
      #-- storage class name (leave empty for default)
      storageClassName: netapp-file-standard
  #-- Loki logging configuration
  loki:
    #-- Loki endpoint URL for winston-loki transport
    url: ~
  #-- S3-compatible attachment storage configuration for ObjectScale/MinIO
  s3:
    #-- S3-compatible endpoint
    endpoint: https://commonservices.objectstore.gov.bc.ca
    #-- bucket names per environment
    buckets:
      dev: notify-dev
      test: notify-test
      prod: notify-prod
    #-- region for S3-compatible storage
    region: ca-central-1
    #-- use path-style requests by default for MinIO and ObjectScale compatibility
    forcePathStyle: true
    #-- existing secret containing S3 credentials
    existingSecret: objectstorage-secrets
    #-- key in existingSecret for access key ID
    accessKeySecretKey: AccessKeyID
    #-- key in existingSecret for secret access key
    secretKeySecretKey: AccessSecretKey

frontend:
  # -- enable or disable a component deployment.
  enabled: true
  # -- the deployment strategy, can be "Recreate" or "RollingUpdate".
  # -- Recreate is the DEV/PR default; TEST and PROD use RollingUpdate
  # -- (see values-test.yaml / values-prod.yaml).
  deploymentStrategy: Recreate
  #-- the number of replicas. Only applied when autoscaling is off for this
  #-- component (global.autoscaling AND frontend.autoscaling.enabled).
  replicaCount: 1

  # -- Kubernetes Secret containing Keycloak and API Gateway configuration
  secrets:
    #-- enable or disable secret-based config. set to true to use existing secrets. set to false to use values directly.
    enabled: true
    #-- the name of the existing secret. should be notify-frontend-config for all environments (dev/test/prod).
    name: notify-frontend-config
    #-- Keycloak configuration - only used if secrets.enabled=false AND you want Helm to create the secret. otherwise leave null.
    keycloakUrl: ~
    keycloakRealm: ~
    keycloakClientId: ~
    apiGatewayNotifyUrl: ~

  #-- autoscaling for the component. it is optional and is an object.
  autoscaling:
    #-- enable or disable autoscaling.
    enabled: true
    #-- the minimum number of replicas.
    minReplicas: 3
    #-- the maximum number of replicas.
    maxReplicas: 7
    #-- the target cpu utilization percentage, is from request cpu and NOT LIMIT CPU.
    targetCPUUtilizationPercentage: 80
  #-- the service for the component. for inter namespace communication, use the service name as the hostname.
  service:
    #-- enable or disable the service.
    enabled: true
    #-- the type of the service. it can be ClusterIP, NodePort, LoadBalancer, ExternalName. ClusterIP is the default and is recommended.
    type: ClusterIP
    #-- the ports for the service.
    ports:
      - name: http
        #-- the port for the service. the service will be accessible on this port within the namespace.
        port: 80
        #-- the container port where the application is listening on
        targetPort: 3000
        #-- the protocol for the port. it can be TCP or UDP. TCP is the default and is recommended.
        protocol: TCP
      - port: 3003
        targetPort: 3003
        protocol: TCP
        name: metrics
  ingress:
    annotations:
      haproxy.router.openshift.io/balance: 'roundrobin'
      route.openshift.io/termination: 'edge'
      haproxy.router.openshift.io/rate-limit-connections: 'true'
      haproxy.router.openshift.io/rate-limit-connections.concurrent-tcp: '100'
      haproxy.router.openshift.io/rate-limit-connections.rate-http: '200'
      haproxy.router.openshift.io/rate-limit-connections.rate-tcp: '500'
      haproxy.router.openshift.io/disable_cookies: 'true'
  pdb:
    # Off for DEV/PR — with a single replica, minAvailable 1 blocks node drains.
    # Enabled in values-test.yaml and values-prod.yaml.
    enabled: false
    # Must stay strictly BELOW the replica count, or drains never complete.
    minAvailable: 1

  #-- Promtail sidecar configuration for log shipping to Loki
  promtail:
    #-- enable or disable Promtail sidecar
    enabled: false
    #-- Promtail Docker image
    image: grafana/promtail
    #-- Promtail image tag
    tag: 2.9.3
    #-- Loki endpoint URL
    lokiUrl: http://loki.f6bc3f-tools.svc.cluster.local:3100/loki/api/v1/push
    #-- Loki tenant ID (optional)
    tenantId: ~
    #-- Cluster label
    cluster: silver
    #-- Environment label (auto-detected from namespace if not set)
    environment: ~
    #-- Job name for logs (auto-generated if not set)
    jobName: ~
    #-- Resource requests and limits for Promtail sidecar
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
