{{- if .Values.backend.awsSms.credentialsSync.enabled }}
{{- $secret := .Values.backend.awsSms.credentialsSecret }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-aws-sms-credentials-sync
  namespace: {{ .Release.Namespace }}
---
# Read and patch the one Secret it maintains, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-aws-sms-credentials-sync
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secret | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-aws-sms-credentials-sync
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-aws-sms-credentials-sync
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-aws-sms-credentials-sync
---
# Copies the SMS IAM user's current access key from Parameter Store into the Secret
# (backend/src/scripts/sync-aws-sms-credentials.ts). It runs several times inside each two-day
# window, so a missed run or two costs nothing; two days of failures leave the Secret holding a
# deleted key, which then has to be re-seeded by hand.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-aws-sms-credentials-sync
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.backend.awsSms.credentialsSync.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: {{ .Release.Name }}-aws-sms-credentials-sync
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
          containers:
            - name: sync
              # The backend image: the script is compiled with it, and its entrypoint is node.
              image: "{{ .Values.global.registry | default "ghcr.io" }}/{{ .Values.global.repository }}/backend:{{ .Values.global.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ default "Always" .Values.backend.imagePullPolicy }}
              args: ["/app/dist/scripts/sync-aws-sms-credentials.js"]
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              env:
                - name: NODE_ENV
                  value: production
                - name: AWS_REGION
                  value: {{ .Values.backend.awsSms.region | quote }}
                - name: AWS_SMS_KEYS_PARAMETER
                  value: {{ .Values.backend.awsSms.credentialsSync.keysParameter | quote }}
                - name: AWS_SMS_CREDENTIALS_SECRET
                  value: {{ $secret | quote }}
                # Trust the API server's certificate when patching the Secret.
                - name: NODE_EXTRA_CA_CERTS
                  value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
{{- end }}
