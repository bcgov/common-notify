{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "frontend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  strategy:
    type: {{ .Values.frontend.deploymentStrategy }}
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3003'
        prometheus.io/path: '/metrics'
      labels:
        {{- include "frontend.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: {{ include "frontend.fullname" . }}
          {{- if .Values.frontend.promtail.enabled }}
          command:
            - /bin/sh
            - -c
            - exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile 2>&1 | tee -a /var/log/caddy/access.log
          {{- end }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          image: "{{ .Values.global.registry | default "ghcr.io" }}/{{.Values.global.repository}}/frontend:{{ .Values.global.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ default "Always" .Values.frontend.imagePullPolicy }}
          {{- if .Values.frontend.promtail.enabled }}
          env:
            - name: CADDY_LOG_OUTPUT
              value: "file:/var/log/caddy/access.log"
          {{- end }}
          env:
            - name: BACKEND_URL
              value: "http://{{ .Release.Name }}-backend"
            - name: LOG_LEVEL
              value: "info"
            # PR deploys (release name common-notify-<number>) proxy API calls to the
            # PR-specific Kong route via a /pr-<number> path prefix; empty everywhere else.
            - name: GATEWAY_PATH_PREFIX
              {{- if regexMatch "^common-notify-[0-9]+$" .Release.Name }}
              value: "/pr-{{ trimPrefix "common-notify-" .Release.Name }}"
              {{- else }}
              value: ""
              {{- end }}
            {{- if .Values.frontend.secrets.enabled }}
            - name: VITE_API_GATEWAY_NOTIFY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontend.secrets.name | default (printf "%s-frontend-config" .Release.Name) }}
                  key: api-gateway-notify-url
            - name: VITE_KEYCLOAK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontend.secrets.name | default (printf "%s-frontend-config" .Release.Name) }}
                  key: keycloak-url
            - name: VITE_KEYCLOAK_REALM
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontend.secrets.name | default (printf "%s-frontend-config" .Release.Name) }}
                  key: keycloak-realm
            - name: VITE_KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontend.secrets.name | default (printf "%s-frontend-config" .Release.Name) }}
                  key: keycloak-client-id
            - name: VITE_CSTAR_API_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontend.secrets.name | default (printf "%s-frontend-config" .Release.Name) }}
                  key: cstar-api-url
            - name: VITE_CSTAR_TENANT_SETUP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontend.secrets.name | default (printf "%s-frontend-config" .Release.Name) }}
                  key: cstar-tenant-setup-url
            {{- else }}
            # No environment defaults for these two. They previously fell back to the DEV
            # gateway and DEV Keycloak, so a deploy that forgot to set them came up
            # working but pointed at dev — silently, in whatever environment it was.
            # Fail the render instead: a missing value here is always a mistake.
            - name: VITE_API_GATEWAY_NOTIFY_URL
              value: {{ required "frontend.apiGatewayNotifyUrl is required when frontend.secrets.enabled=false (set it to this environment's API gateway base URL)" .Values.frontend.apiGatewayNotifyUrl | quote }}
            - name: VITE_KEYCLOAK_URL
              value: {{ required "frontend.keycloakUrl is required when frontend.secrets.enabled=false (set it to this environment's Keycloak URL)" .Values.frontend.keycloakUrl | quote }}
            - name: VITE_KEYCLOAK_REALM
              value: {{ .Values.frontend.keycloakRealm | default "standard" | quote }}
            - name: VITE_KEYCLOAK_CLIENT_ID
              value: {{ .Values.frontend.keycloakClientId | default "notify-6388" | quote }}
            - name: VITE_CSTAR_API_URL
              value: {{ .Values.frontend.cstarApiUrl | default "" | quote }}
            - name: VITE_CSTAR_TENANT_SETUP_URL
              value: {{ .Values.frontend.cstarTenantSetupUrl | default "" | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 30
          #-- the liveness probe for the container. it is optional and is an object. for default values check this link: https://github.com/bcgov/helm-service/blob/main/charts/component/templates/deployment.yaml#L324-L328
          livenessProbe:
            successThreshold: 1
            failureThreshold: 3
            httpGet:
              path: /health
              port: 3001
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 30m
              memory: 50Mi
            limits:
              cpu: 4
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if .Values.frontend.promtail.enabled }}
            - name: shared-logs
              mountPath: /var/log/caddy
            {{- end }}
        {{- if .Values.frontend.promtail.enabled }}
        - name: promtail
          image: {{ .Values.frontend.promtail.image }}:{{ .Values.frontend.promtail.tag }}
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/promtail/promtail-config.yaml
          volumeMounts:
            - name: promtail-config
              mountPath: /etc/promtail
            - name: shared-logs
              mountPath: /var/log/caddy
              readOnly: true
          resources:
            requests:
              cpu: {{ .Values.frontend.promtail.resources.requests.cpu }}
              memory: {{ .Values.frontend.promtail.resources.requests.memory }}
            limits:
              cpu: {{ .Values.frontend.promtail.resources.limits.cpu }}
              memory: {{ .Values.frontend.promtail.resources.limits.memory }}
        {{- end }}
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.frontend.promtail.enabled }}
        - name: shared-logs
          emptyDir: {}
        - name: promtail-config
          configMap:
            name: {{ include "frontend.fullname" . }}-promtail-config
        {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - {{ include "frontend.fullname" . }}
                  - key: app.kubernetes.io/instance
                    operator: In
                    values:
                      - {{ .Release.Name }}
              topologyKey: "kubernetes.io/hostname"

{{- end }}
