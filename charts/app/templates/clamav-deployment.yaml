{{- if .Values.backend.clamav.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-clamav
  namespace: {{ .Release.Namespace }}
  labels:
    app: clamav
    app.kubernetes.io/name: clamav
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clamav
      app.kubernetes.io/name: clamav
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: clamav
        app.kubernetes.io/name: clamav
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext: {}
      containers:
        - name: clamav
          # Using official ClamAV image with custom command to bypass chown operations
          image: clamav/clamav:stable-debian
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              # clamd's config is written FIRST so that freshclam's NotifyClamd below
              # has a file to point at from its very first update.
              cat > /tmp/clamd.conf <<CLAMDEOF
              LogFile /tmp/clamd.log
              LogFileMaxSize 10M
              LogTime yes
              LogVerbose yes
              DatabaseDirectory /var/lib/clamav
              LocalSocket /tmp/clamd.sock
              TCPSocket 3310
              TCPAddr 0.0.0.0
              MaxThreads 12
              MaxConnectionQueueLength 30
              StreamMaxLength 100M
              CLAMDEOF

              # Mirrors come from backend.clamav.freshclam.mirrors, in preference
              # order — freshclam tries each until one answers. Each carries an
              # explicit https:// scheme; without one freshclam uses plain HTTP on
              # port 80, which the egress policy no longer permits.
              #
              # Egress is restricted to backend.clamav.freshclam.egress.cidrs, so a
              # mirror added here without its address range added there will hang.
              #
              # Checks + NotifyClamd are what keep definitions current. Without them
              # freshclam updated once at startup and exited, and because
              # /var/lib/clamav is an emptyDir the signatures then froze at the pod's
              # creation date for the life of the pod (months, in practice).
              cat > /tmp/freshclam.conf <<EOF
              {{- range .Values.backend.clamav.freshclam.mirrors }}
              DatabaseMirror {{ . }}
              {{- end }}
              DatabaseDirectory /var/lib/clamav
              LogVerbose yes
              LogTime yes
              Foreground yes
              Checks {{ .Values.backend.clamav.freshclam.checksPerDay }}
              NotifyClamd /tmp/clamd.conf
              EOF

              # One blocking update first, so clamd never starts against an empty
              # database directory. Failure here is not fatal: the wait loop below
              # keeps trying via the daemon rather than crashing the container.
              echo "Fetching initial virus databases..."
              /usr/bin/freshclam --config-file=/tmp/freshclam.conf --no-warnings || \
                echo "Initial freshclam run failed; the daemon will keep retrying."

              # Then run freshclam as a DAEMON for the life of the pod. --daemon is the
              # difference between updating once and honouring Checks above; clamd is
              # told to reload via NotifyClamd whenever an update lands.
              /usr/bin/freshclam --config-file=/tmp/freshclam.conf --daemon &

              # Wait for databases to be present (check for daily.cvd/cld)
              while [ ! -f /var/lib/clamav/daily.cvd ] && [ ! -f /var/lib/clamav/daily.cld ]; do
                echo "Waiting for virus databases to download..."
                sleep 10
              done

              echo "Virus databases present, starting clamd..."

              # Start clamd with custom config and tail logs to stdout
              /usr/sbin/clamd --foreground=yes --config-file=/tmp/clamd.conf &
              CLAMD_PID=$!

              # Tail logs to stdout
              tail -f /tmp/clamd.log &

              # Wait for clamd process
              wait $CLAMD_PID
          ports:
            - name: clamd
              containerPort: 3310
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: 3310
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 3310
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3310
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: 2
              memory: 2Gi
          volumeMounts:
            - name: clamav-data
              mountPath: /var/lib/clamav
            - name: clamav-run
              mountPath: /run/clamav
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: clamav-data
          emptyDir: {}
        - name: clamav-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
