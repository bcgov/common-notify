{{- if .Values.cstarMcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cstar-mcp
spec:
  replicas: {{ .Values.cstarMcp.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app: cstar-mcp }
  template:
    metadata:
      labels: { app: cstar-mcp }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: cstar-mcp }
      containers:
        - name: cstar-mcp
          image: {{ required "cstarMcp.image must be supplied when the adapter is enabled" .Values.cstarMcp.image | quote }}
          ports:
            - { name: http, containerPort: 3101 }
          envFrom:
            - secretRef:
                name: {{ .Values.cstarMcp.secretName }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: cstar-mcp
spec:
  selector: { app: cstar-mcp }
  ports:
    - { name: http, port: 3101, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cstar-mcp
spec:
  podSelector:
    matchLabels: { app: cstar-mcp }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "backend.selectorLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: 3101 }
{{- if gt (int .Values.cstarMcp.replicaCount) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cstar-mcp
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: cstar-mcp }
{{- end }}
{{- end }}
