{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  strategy:
    type: {{ .Values.backend.deploymentStrategy }}
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
        prometheus.io/path: '/api/metrics'
      labels:
        {{- include "backend.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: {{ include "backend.fullname" . }}-init
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          image: "{{ .Values.global.registry | default "ghcr.io" }}/{{.Values.global.repository}}/migrations:{{ .Values.global.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ default "Always" .Values.backend.imagePullPolicy }}
          envFrom:
            - secretRef:
                name: {{.Release.Name}}-flyway
          env:
            - name: FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: FLYWAY_DEFAULT_SCHEMA
              value: "notify"
            - name: FLYWAY_CONNECT_RETRIES
              value: "10"
            - name: FLYWAY_GROUP
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 200Mi
            limits:
              cpu: 4
              memory: 8Gi
      containers:
        - name: {{ include "backend.fullname" . }}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          image: "{{ .Values.global.registry | default "ghcr.io" }}/{{.Values.global.repository}}/backend:{{ .Values.global.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ default "Always" .Values.backend.imagePullPolicy }}
          envFrom:
            - secretRef:
                name: {{.Release.Name}}-backend
            - secretRef:
                name: app-api-secrets
          env:
            - name: LOG_LEVEL
              value: info
            - name: GC_NOTIFY_BASE_URL
              value: https://api.notification.canada.ca
            - name: REDIS_HOST
              value: {{ .Values.global.config.redisHost | default (printf "%s-redis-master" .Release.Name) }}
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.config.redisSecret | default (printf "%s-redis" .Release.Name) }}
                  key: redis-password
            - name: REDIS_DB
              value: "0"
            - name: INGESTION_WORKER_CONCURRENCY
              value: "1"
            - name: CLAMAV_HOST
              value: {{ .Values.backend.clamav.host | default (printf "%s-clamav" .Release.Name) | quote }}
            - name: CLAMAV_PORT
              value: {{ .Values.backend.clamav.port | default 3310 | quote }}
            - name: CLAMAV_TIMEOUT
              value: {{ .Values.backend.clamav.timeout | default 30000 | quote }}
            - name: CLAMAV_ENABLED
              value: {{ .Values.backend.clamav.enabled | default "true" | quote }}
            - name: ATTACHMENT_STORAGE_DIR
              value: {{ .Values.backend.attachments.storageDir | default "/app/attachments" | quote }}
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: GATEWAY_OAUTH2_TOKEN_URL
              valueFrom:
                secretKeyRef:
                  name: app-api-secrets
                  key: API_GATEWAY_TOKEN_URL
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: app-api-secrets
                  key: TWILIO_ACCOUNT_SID
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-api-secrets
                  key: TWILIO_AUTH_TOKEN
            - name: TWILIO_FROM_NUMBER
              valueFrom:
                secretKeyRef:
                  name: app-api-secrets
                  key: TWILIO_FROM_NUMBER
            - name: FRONTEND_KEYCLOAK_ISSUER
              valueFrom:
                secretKeyRef:
                  name: app-api-secrets
                  key: FRONTEND_KEYCLOAK_ISSUER
            - name: API_GATEWAY_KEYCLOAK_ISSUER
              valueFrom:
                secretKeyRef:
                  name: app-api-secrets
                  key: API_GATEWAY_KEYCLOAK_ISSUER
            - name: NOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: app-api-secrets
                  key: NOTIFY_CLIENT_ID
            - name: CSTAR_API_URL
              valueFrom:
                secretKeyRef:
                  name: app-api-secrets
                  key: CSTAR_API_URL
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 30
          livenessProbe:
            successThreshold: 1
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          resources: # this is optional
            requests:
              cpu: 50m
              memory: 200Mi
            limits:
              cpu: 4
              memory: 8Gi
          {{- if .Values.backend.attachments.pvc.enabled }}
          volumeMounts:
            - name: attachments
              mountPath: {{ .Values.backend.attachments.storageDir | default "/app/attachments" }}
          {{- end }}
      {{- if .Values.backend.attachments.pvc.enabled }}
      volumes:
        - name: attachments
          persistentVolumeClaim:
            claimName: {{ if .Values.backend.attachments.pvc.shared }}nr-notify-attachments-shared{{ else }}{{ include "backend.fullname" . }}-attachments{{ end }}
      {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - {{ include "backend.fullname" . }}
                  - key: app.kubernetes.io/instance
                    operator: In
                    values:
                      - {{ .Release.Name }}
              topologyKey: "kubernetes.io/hostname"

{{- end }}
