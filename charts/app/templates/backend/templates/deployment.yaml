{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  strategy:
    type: {{ .Values.backend.deploymentStrategy }}
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
        prometheus.io/path: '/api/metrics'
      labels:
        {{- include "backend.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: {{ include "backend.fullname" . }}-init
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          image: "{{ .Values.global.registry | default "ghcr.io" }}/{{.Values.global.repository}}/migrations:{{ .Values.global.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ default "Always" .Values.backend.imagePullPolicy }}
          envFrom:
            - secretRef:
                name: {{.Release.Name}}-flyway
          env:
            - name: FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: FLYWAY_DEFAULT_SCHEMA
              value: "notify"
            - name: FLYWAY_CONNECT_RETRIES
              value: "10"
            - name: FLYWAY_GROUP
              value: "true"
          command: ["/bin/sh", "-c"]
          args:
            - /flyway/flyway info migrate repair && cp -R /flyway/assets/email-logos/. /email-logo-seed-assets/
          volumeMounts:
            - name: email-logo-seed-assets
              mountPath: /email-logo-seed-assets
          resources:
            requests:
              cpu: 50m
              memory: 200Mi
            limits:
              cpu: 4
              memory: 8Gi
      containers:
        - name: {{ include "backend.fullname" . }}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          image: "{{ .Values.global.registry | default "ghcr.io" }}/{{.Values.global.repository}}/backend:{{ .Values.global.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ default "Always" .Values.backend.imagePullPolicy }}
          envFrom:
            - secretRef:
                name: {{.Release.Name}}-backend
            - secretRef:
                name: app-api-secrets
            # Per-release overrides, layered last so its keys win. envFrom entries are
            # applied in order and a later duplicate key replaces an earlier one, so this
            # secret only needs the handful of keys being changed — everything else falls
            # through to app-api-secrets above.
            #
            # Exists so a single PR environment can be repointed (at a different APS
            # instance, say) without a chart change, a redeploy, or disturbing the other
            # releases that share the namespace secret. Not created by this chart: Helm
            # would reconcile it back on the next upgrade and silently discard manual
            # edits. Create it by hand and delete it when finished:
            #
            #   oc create secret generic {{ .Release.Name }}-overrides --from-literal=KEY=value
            #   oc delete secret {{ .Release.Name }}-overrides
            #
            # pr-close.yml removes it automatically when a PR is closed. Optional, so a
            # release without one deploys exactly as before.
            #
            # Worth knowing in a long-lived environment: an override here is invisible in
            # git. Prefer values.yaml or app-api-secrets for anything meant to persist.
            - secretRef:
                name: {{ .Release.Name }}-overrides
                optional: true
          env:
            - name: LOG_LEVEL
              value: info
            - name: GC_NOTIFY_BASE_URL
              value: https://api.notification.canada.ca
            - name: REDIS_HOST
              value: {{ .Values.global.config.redisHost | default (printf "%s-redis-master" .Release.Name) }}
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.config.redisSecret | default (printf "%s-redis" .Release.Name) }}
                  key: redis-password
            - name: REDIS_DB
              value: "0"
            - name: INGESTION_WORKER_CONCURRENCY
              value: "1"
            - name: CLAMAV_HOST
              value: {{ .Values.backend.clamav.host | default (printf "%s-clamav" .Release.Name) | quote }}
            - name: CLAMAV_PORT
              value: {{ .Values.backend.clamav.port | default 3310 | quote }}
            - name: CLAMAV_TIMEOUT
              value: {{ .Values.backend.clamav.timeout | default 30000 | quote }}
            - name: CLAMAV_ENABLED
              value: {{ .Values.backend.clamav.enabled | default "true" | quote }}
            - name: CLAMAV_FAIL_CLOSED
              value: {{ .Values.backend.clamav.failClosed | default "false" | quote }}
            - name: S3_ENDPOINT
              value: {{ .Values.backend.s3.endpoint | quote }}
            - name: S3_BUCKET
              value: {{ if contains "-dev" .Release.Namespace }}{{ .Values.backend.s3.buckets.dev | quote }}{{ else if contains "-test" .Release.Namespace }}{{ .Values.backend.s3.buckets.test | quote }}{{ else if contains "-prod" .Release.Namespace }}{{ .Values.backend.s3.buckets.prod | quote }}{{ else }}{{ .Values.backend.s3.buckets.dev | quote }}{{ end }}
            - name: EMAIL_LOGO_SEED_ASSET_DIRECTORY
              value: /app/email-logo-seed-assets
            - name: PUBLIC_API_GATEWAY_BASE_URL
              {{- if .Values.frontend.secrets.enabled }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontend.secrets.name | default (printf "%s-frontend-config" .Release.Name) }}
                  key: api-gateway-notify-url
              {{- else }}
              value: {{ .Values.frontend.apiGatewayNotifyUrl | quote }}
              {{- end }}
            - name: PUBLIC_API_GATEWAY_PATH_PREFIX
              {{- if regexMatch "^common-notify-[0-9]+$" .Release.Name }}
              value: "/pr-{{ trimPrefix "common-notify-" .Release.Name }}"
              {{- else }}
              value: ""
              {{- end }}
            - name: S3_REGION
              value: {{ .Values.backend.s3.region | quote }}
            - name: S3_FORCE_PATH_STYLE
              value: {{ .Values.backend.s3.forcePathStyle | default true | quote }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.s3.existingSecret | quote }}
                  key: {{ .Values.backend.s3.accessKeySecretKey | quote }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.s3.existingSecret | quote }}
                  key: {{ .Values.backend.s3.secretKeySecretKey | quote }}
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: NODE_ENV
              value: "production"
            - name: LOKI_URL
              value: {{ .Values.backend.loki.url | default "http://loki.f6bc3f-tools.svc.cluster.local:3100" | quote }}
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: INSTANCE_LABEL
              value: {{ .Release.Name | quote }}
            - name: GATEWAY_OAUTH2_TOKEN_URL
              valueFrom:
                secretKeyRef:
                  name: app-api-secrets
                  key: API_GATEWAY_TOKEN_URL
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: app-api-secrets
                  key: TWILIO_ACCOUNT_SID
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-api-secrets
                  key: TWILIO_AUTH_TOKEN
            - name: TWILIO_FROM_NUMBER
              valueFrom:
                secretKeyRef:
                  name: app-api-secrets
                  key: TWILIO_FROM_NUMBER
            - name: ACS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: app-api-secrets
                  key: ACS_CONNECTION_STRING
            - name: ACS_FROM_NUMBER
              valueFrom:
                secretKeyRef:
                  name: app-api-secrets
                  key: ACS_FROM_NUMBER
            - name: FRONTEND_KEYCLOAK_ISSUER
              valueFrom:
                secretKeyRef:
                  name: app-api-secrets
                  key: FRONTEND_KEYCLOAK_ISSUER
            - name: API_GATEWAY_KEYCLOAK_ISSUER
              valueFrom:
                secretKeyRef:
                  name: app-api-secrets
                  key: API_GATEWAY_KEYCLOAK_ISSUER
            - name: NOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: app-api-secrets
                  key: NOTIFY_CLIENT_ID
            - name: CSTAR_API_URL
              valueFrom:
                secretKeyRef:
                  name: app-api-secrets
                  key: CSTAR_API_URL
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 30
          livenessProbe:
            successThreshold: 1
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          resources: # this is optional
            requests:
              cpu: 50m
              memory: 200Mi
            limits:
              cpu: 4
              memory: 8Gi
          volumeMounts:
            - name: email-logo-seed-assets
              mountPath: /app/email-logo-seed-assets
              readOnly: true
      volumes:
        - name: email-logo-seed-assets
          emptyDir: {}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - {{ include "backend.fullname" . }}
                  - key: app.kubernetes.io/instance
                    operator: In
                    values:
                      - {{ .Release.Name }}
              topologyKey: "kubernetes.io/hostname"

{{- end }}
