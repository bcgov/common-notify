{{- if and .Values.backend.enabled .Values.backend.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backend-netpol
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: backend
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from OpenShift Router (for external API Gateway access)
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 3000
    # Allow traffic from monitoring/metrics scrapers
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
      ports:
        - protocol: TCP
          port: 3000
    {{- with .Values.backend.networkPolicy.metricsScrapeNamespaceSelector }}
    # Our own Prometheus, which scrapes /api/metrics from the tools namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3000
    {{- end }}
    # Kong's Data Plane only. The API-key routes work the tenant out from Kong's
    # x-credential-identifier / x-consumer-* headers, so anything else on the
    # cluster could set those itself and bypass the gateway entirely.
    - from:
        - namespaceSelector:
            matchLabels:
              name: {{ required "backend.networkPolicy.apiGatewayLicensePlate is required: the APS Kong Data Plane license plate" .Values.backend.networkPolicy.apiGatewayLicensePlate }}
      ports:
        - protocol: TCP
          port: 3000
{{- end }}
