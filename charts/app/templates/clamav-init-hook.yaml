{{- if .Values.clamav.enabled }}
{{- if .Values.clamav.sharedMode.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "clamav.fullname" . }}-init
  namespace: {{ .Values.clamav.sharedMode.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "clamav.labels" . | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "clamav.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "clamav.serviceAccountName" . }}
      restartPolicy: Never
      containers:
      - name: init
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          # Check if ClamAV release already exists in shared namespace
          RELEASE_NAME="{{ include "clamav.fullname" . }}"
          NAMESPACE="{{ .Values.clamav.sharedMode.namespace }}"

          echo "Checking for existing ClamAV release: $RELEASE_NAME in $NAMESPACE"

          # Try to get the deployment to see if ClamAV is already running
          if kubectl get deployment -n $NAMESPACE $RELEASE_NAME 2>/dev/null; then
            echo "✓ ClamAV already deployed in $NAMESPACE, skipping initialization"
            exit 0
          fi

          echo "ClamAV not found, would deploy to shared namespace"
          echo "Note: Manual deployment required or use GitOps pipeline"
          exit 0
{{- end }}
{{- end }}
