{{- if .Values.backend.clamav.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-clamav-netpol
  namespace: {{ .Release.Namespace }}
  labels:
    app: clamav
    app.kubernetes.io/name: clamav
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      app: clamav
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from all backend pods in the namespace (shared ClamAV for PRs)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      ports:
        - protocol: TCP
          port: 3310
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 5353
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Virus-definition updates (freshclam), HTTPS only.
    #
    # An egress rule with `ports` but no `to` matches EVERY destination — the
    # previous rules here allowed 443 and 80 to 0.0.0.0/0. ClamAV runs an inline
    # shell and fetches definitions at runtime, so that was an unrestricted
    # outbound path from a pod that processes untrusted uploads.
    #
    # Destinations now come from backend.clamav.freshclam.egress.cidrs, which must
    # cover every mirror in backend.clamav.freshclam.mirrors. NetworkPolicy has no
    # hostname selector, so mirrors can only be expressed as IP ranges.
    #
    # Port 80 is deliberately absent: every mirror is declared https://, so plain
    # HTTP is never used and allowing it would only reopen a cleartext path out.
    {{- with .Values.backend.clamav.freshclam }}
    - to:
        {{- range .egress.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
