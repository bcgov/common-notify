# PROD environment overrides for the app chart.
#
# Layered on top of values.yaml (the chart's own defaults, which are the
# DEV/PR profile — single replica, Recreate, no PDB). Only the deltas live here.
#
# Previously these settings were passed as scattered `--set` flags from
# .github/workflows/merge.yml, so the deployed shape of production was invisible
# in code review and drifted from git. Keeping them here makes the environment
# reviewable and diffable.
#
# Quota headroom (f6bc3f-prod: 4000m CPU / 16Gi memory, ~2060m CPU in use):
#   backend  50m + 200Mi per pod, frontend 30m + 50Mi per pod
#   at maxReplicas 7+7 that is 560m CPU / 1750Mi memory total.

global:
  #-- required for the HPAs to be rendered at all; see hpa.yaml
  autoscaling: true

backend:
  #-- rolling, so a prod deploy never drops the service
  deploymentStrategy: RollingUpdate
  autoscaling:
    enabled: true
    minReplicas: 5
    #-- above minReplicas so the HPA can actually scale under load. It was
    #-- previously pinned at 5/5, which made the HPA a fixed replica count and
    #-- left targetCPUUtilizationPercentage (80) with nothing to act on.
    maxReplicas: 7
  pdb:
    enabled: true
    #-- was 1, which let a node drain reduce production to a SINGLE pod. 2 keeps
    #-- redundancy through a drain while staying well below minReplicas (5) so
    #-- drains still complete.
    minAvailable: 2

frontend:
  deploymentStrategy: RollingUpdate
  autoscaling:
    enabled: true
    minReplicas: 5
    maxReplicas: 7
  pdb:
    enabled: true
    minAvailable: 2
