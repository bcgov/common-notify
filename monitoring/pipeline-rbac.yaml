---
# Grant pipeline service account permissions to manage RBAC resources
# This is required for Helm to deploy charts that create ServiceAccounts and Roles
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-rbac-manager
  namespace: f6bc3f-dev
rules:
  # Allow managing RBAC resources
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]

  # Allow managing service accounts
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-rbac-manager-binding
  namespace: f6bc3f-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-rbac-manager
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: f6bc3f-dev
