apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-allow-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: grafana
  policyTypes:
  - Ingress
  ingress:
  # Allow traffic from OpenShift ingress router
  - from:
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: ingress
    ports:
    - protocol: TCP
      port: 3000
  # Allow traffic from within the same namespace (for Loki integration)
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 3000
