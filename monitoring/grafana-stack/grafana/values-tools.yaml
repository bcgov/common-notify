# Grafana - Visualization & Dashboards (Centralized Tools Environment)
# Deployment: f6bc3f-tools namespace
# Purpose: Query logs from Loki, display dashboards for ALL environments (dev/test/prod)
# Resource Profile: Centralized - handles queries from multiple environments

# Admin credentials from OpenShift Secret
# The secret is created separately in secret.yaml
admin:
  existingSecret: grafana-admin-credentials
  userKey: admin-user
  passwordKey: admin-password

# Persistence for dashboards
# Disabled due to storage quota limits in tools namespace (5Gi total, all used by Loki)
persistence:
  enabled: false
  # storageClassName: netapp-file-standard
  # size: 2Gi

# Resources for centralized deployment
# Note: CPU request reduced to fit within tools namespace quota (50m remaining after Loki)
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 256Mi

# Datasources - Pre-configure Loki in tools namespace
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      # Loki datasource (centralized in tools namespace)
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.f6bc3f-tools.svc.cluster.local:3100
        isDefault: true
        jsonData:
          maxLines: 5000
          derivedFields:
            # Extract notificationId from logs for easy linking
            - datasourceUid: Loki
              matcherRegex: '"notificationId":"([^"]+)"'
              name: NotificationID
              url: ''
      # Loki Alerting (Ruler API)
      - name: Loki Alerting
        type: loki
        access: proxy
        url: http://loki.f6bc3f-tools.svc.cluster.local:3100
        jsonData:
          manageAlerts: true
          alertmanagerUid: alertmanager

# Alerting - Provision contact points and notification policies
alerting:
  contactpoints.yaml:
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: common-notify-email
        receivers:
          - uid: common-notify-webhook
            type: webhook
            settings:
              url: https://n8n.developer.gov.bc.ca/webhook/3b412e93-0003-4414-b9f3-bcaf18d9bc64
              httpMethod: POST
              title: 'Grafana Alert Notification'
              message: |
                {{ `{{ if gt (len .Alerts.Firing) 0 }}` }}
                **🔴 FIRING ALERTS ({{ `{{ len .Alerts.Firing }}` }})**
                {{ `{{ range .Alerts.Firing }}` }}
                ---
                **Alert:** {{ `{{ .Labels.alertname }}` }}
                **Severity:** {{ `{{ .Labels.severity }}` }}
                **Namespace:** {{ `{{ .Labels.namespace }}` }}
                **Service:** {{ `{{ .Labels.service }}` }}
                {{ `{{ if .Labels.app }}` }}**App:** {{ `{{ .Labels.app }}{{ end }}` }}

                **Summary:** {{ `{{ .Annotations.summary }}` }}
                {{ `{{ if .Annotations.description }}` }}**Description:** {{ `{{ .Annotations.description }}{{ end }}` }}

                **Status:** Firing for {{ `{{ .StartsAt | since }}` }}
                [View in Grafana]({{ `{{ .GeneratorURL }}` }})
                {{ `{{ end }}` }}
                {{ `{{ end }}` }}

                {{ `{{ if gt (len .Alerts.Resolved) 0 }}` }}
                **✅ RESOLVED ALERTS ({{ `{{ len .Alerts.Resolved }}` }})**
                {{ `{{ range .Alerts.Resolved }}` }}
                ---
                **Alert:** {{ `{{ .Labels.alertname }}` }}
                **Namespace:** {{ `{{ .Labels.namespace }}` }}
                **Resolved at:** {{ `{{ .EndsAt }}` }}
                {{ `{{ end }}` }}
                {{ `{{ end }}` }}
            disableResolveMessage: false

  policies.yaml:
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: common-notify-email
        group_by:
          - alertname
          - namespace
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          - receiver: common-notify-email
            matchers:
              - severity =~ "warning|critical"
            continue: false

# Dashboard providers - Load dashboards from ConfigMaps
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: 'Common Notify'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

# Pre-load dashboards
# Dashboards are loaded from JSON files in the monitoring/dashboards directory
dashboards:
  default: {}

# Sidecar for auto-loading dashboards from ConfigMaps
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folder: /tmp/dashboards
    defaultFolderName: "Common Notify"
    searchNamespace: f6bc3f-tools
    provider:
      foldersFromFilesStructure: false
    resource: configmap

# Grafana configuration
grafana.ini:
  server:
    root_url: "%(protocol)s://%(domain)s:%(http_port)s/"
    serve_from_sub_path: false

  users:
    allow_sign_up: false

  auth.anonymous:
    enabled: false

  log:
    mode: console
    level: info

  # Enable multi-tenancy features
  explore:
    enabled: true

  # OpenShift OAuth Integration
  # Users authenticate with OpenShift (which uses IDIR)
  auth.generic_oauth:
    enabled: true
    name: OpenShift
    allow_sign_up: true
    auto_login: false
    client_id: system:serviceaccount:f6bc3f-tools:grafana
    client_secret: ""
    scopes: user:info user:check-access
    auth_url: https://oauth-openshift.apps.silver.devops.gov.bc.ca/oauth/authorize
    token_url: https://oauth-openshift.apps.silver.devops.gov.bc.ca/oauth/token
    api_url: https://oauth-openshift.apps.silver.devops.gov.bc.ca/oauth/userinfo
    tls_skip_verify_insecure: false
    use_pkce: true
    # Map OpenShift roles to Grafana roles
    role_attribute_path: contains(groups[*], 'system:cluster-admins') && 'Admin' || 'Viewer'

# Service configuration
service:
  type: ClusterIP
  port: 80

# Ingress/Route - Disabled (using separate Route manifest)
ingress:
  enabled: false

# Plugins to install
plugins:
  - grafana-piechart-panel
  - grafana-clock-panel

# Security context - OpenShift compatible (let OpenShift assign UIDs)
podSecurityContext:
  runAsNonRoot: true
  fsGroup: null
  runAsUser: null
  runAsGroup: null

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: null
  runAsGroup: null
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Disable init containers for OpenShift compatibility
initChownData:
  enabled: false

downloadDashboards:
  enabled: false

# Explicitly override default security context
securityContext:
  runAsNonRoot: true
  runAsUser: null
  runAsGroup: null
  fsGroup: null

# Environment variables
env:
  TZ: America/Vancouver
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
    valueFrom:
      secretKeyRef:
        name: grafana-oauth-secret
        key: client-secret
        optional: true

# RBAC - Required for OAuth integration
rbac:
  create: true
  pspEnabled: false
  namespaced: true

serviceAccount:
  create: true
  name: grafana
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.grafana: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"grafana"}}'
