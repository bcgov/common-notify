          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              editorMode: code
              expr: |
                sum(rate({namespace=~"f6bc3f-(test|prod)", app="backend"} |~ "(?i)(database|postgres|connection).*(?i)(error|fail|timeout)" [5m])) by (namespace)
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }
              refId: C
        labels:
          severity: "critical"
          service: "common-notify"
          component: "database"
        annotations:
          short: "{{ $labels.namespace }} database connection errors"
          summary: "Database connection errors in {{ $labels.namespace }}"
          description: "Database connection errors detected ({{ $value }} errors/sec) in {{ $labels.namespace }}"

      - uid: cn-log-redis-errors
