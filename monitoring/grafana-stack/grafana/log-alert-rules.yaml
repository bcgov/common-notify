                sum(rate({namespace=~"f6bc3f-(test|prod)", app="backend"} |~ "(?i)redis.*(?i)(error|fail|timeout|disconnect)" [5m])) by (namespace)
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
