---
# OAuth Client Secret for BC Gov SSO (CSS) Integration
# This secret stores the client credentials obtained from the CSS integration request
#
# IMPORTANT: Actual credentials are stored in GitHub Secrets and injected during deployment
# GitHub Secrets required:
#   - GRAFANA_SSO_CLIENT_ID: notify-6519
#   - GRAFANA_SSO_CLIENT_SECRET: <your-client-secret>
#
# The GitHub Actions workflow will replace __GRAFANA_SSO_CLIENT_ID__ and __GRAFANA_SSO_CLIENT_SECRET__
# with base64-encoded values from GitHub Secrets during deployment.

apiVersion: v1
kind: Secret
metadata:
  name: grafana-sso-credentials
  namespace: f6bc3f-tools
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: sso
type: Opaque
data:
  # These placeholders will be replaced by GitHub Actions workflow
  client_id: __GRAFANA_SSO_CLIENT_ID__
  client_secret: __GRAFANA_SSO_CLIENT_SECRET__
