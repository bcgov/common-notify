apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail
  namespace: f6bc3f-dev
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
      log_level: debug

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki.f6bc3f-dev.svc.cluster.local:3100/loki/api/v1/push
        tenant_id: common-notify-dev
        external_labels:
          cluster: silver
          environment: dev

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - f6bc3f-dev

        pipeline_stages:
          - cri: {}

        relabel_configs:
          # Only scrape running pods
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running

          # Only scrape pods with app.kubernetes.io/instance containing "common-notify"
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            action: keep
            regex: common-notify-.*

          # Add namespace label
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

          # Add pod name label
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

          # Add container name label
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container

          # Add app label
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

          # Add instance label (PR environment identifier)
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            target_label: app_kubernetes_io_instance

          # Add component label (backend/frontend)
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app_kubernetes_io_name
