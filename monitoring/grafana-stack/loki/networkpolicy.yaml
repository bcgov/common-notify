apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-allow-ingress
  namespace: f6bc3f-dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes:
  - Ingress
  ingress:
  # Allow traffic from Grafana
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: grafana
    ports:
    - protocol: TCP
      port: 3100
  # Allow traffic from Grafana Agent (for log ingestion)
  - from:
    - podSelector:
        matchLabels:
          app: grafana-agent
    ports:
    - protocol: TCP
      port: 3100
  # Allow traffic from within the same namespace (for other services)
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 3100
