# Network Policy for Loki in tools namespace
# Allows ingress from Grafana Agents in dev/test/prod namespaces
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-ingress
  namespace: f6bc3f-tools
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes:
    - Ingress
  ingress:
    # Allow Promtail sidecars from dev namespace (common-notify pods)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: f6bc3f-dev
      ports:
        - protocol: TCP
          port: 3100

    # Allow Promtail sidecars from test namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: f6bc3f-test
      ports:
        - protocol: TCP
          port: 3100

    # Allow Promtail sidecars from prod namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: f6bc3f-prod
      ports:
        - protocol: TCP
          port: 3100

    # Allow Grafana in tools namespace to query logs
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 3100
---
# Network Policy for Grafana in tools namespace
# Allows ingress for web UI access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-ingress
  namespace: f6bc3f-tools
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    # Allow all ingress for web UI (OpenShift Route handles TLS termination)
    - from: []
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 3000
