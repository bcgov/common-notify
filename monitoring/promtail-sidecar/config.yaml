apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-frontend-config
  namespace: f6bc3f-dev
data:
  promtail-config.yaml: |
    server:
      http_listen_port: 3101
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki.f6bc3f-dev.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      - job_name: frontend
        static_configs:
          - targets:
              - localhost
            labels:
              job: common-notify-frontend
              app: frontend
              namespace: f6bc3f-dev
              __path__: /var/log/caddy/access.log
